[graph]
all-features = true
exclude = ["examples"]


[bans]
multiple-versions = "allow"

[bans.workspace-dependencies]
duplicates = "allow"
unused = "allow"

[sources.allow-org]
github = ["joeroback", "saxon-parker"]

[licenses]
unused-allowed-license = "allow"
# We want really high confidence when inferring licenses from text
confidence-threshold = 0.92
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Zlib",
]

[[licenses.clarify]]
crate = "ring"
# SPDX considers OpenSSL to encompass both the OpenSSL and SSLeay licenses
# https://spdx.org/licenses/OpenSSL.html
# ISC - Both BoringSSL and ring use this for their new files
# MIT - "Files in third_party/ have their own licenses, as described therein. The MIT
# license, for third_party/fiat, which, unlike other third_party directories, is
# compiled into non-test libraries, is included below."
# OpenSSL - Obviously
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# This crate is from a build-dependency of utoipa-swagger-ui, and uses the BSL-1.0 license.
# Cargo deny does not allow skipping build-dependencies, so we need to allow this crate.
# https://github.com/EmbarkStudios/cargo-deny/issues/744
[[licenses.exceptions]]
allow = ["BSL-1.0"]
name = "lockfree-object-pool"
version = "0.1.6"
