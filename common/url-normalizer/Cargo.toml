[package]
name = "url_normalizer"
version = "0.1.0"
edition = "2021"
description = "A URL normalization library and CLI tool"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA-Omniverse/usd-content-workspace/tree/main/common/url-normalizer"
keywords = ["url", "normalization"]

[dependencies]
url = "2.5"
clap = { version = "4.4", features = ["derive"] }
percent-encoding = "2.3.1"

[lib]
name = "url_normalizer"
path = "src/lib.rs"

[[bin]]
name = "url_normalizer"
path = "src/main.rs"
