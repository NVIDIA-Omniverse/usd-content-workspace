[toolchain]
# Note: also update the `rust-version` in `Cargo.toml`
channel = "1.91.0"
# Note: the profile/components are customized in
# `docker/rust-builder/Dockerfile` to ignore some components that are useful
# locally, but not in CI (e.g. `rust-src`).
profile = "default"
# llvm-tools required for coverage
components = ["llvm-tools"]
