[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
# must also change version of `otel-tools` in `crates/tonic-observability/Cargo.toml` and `crates/axum-observability/Cargo.toml`
version = "0.14.0"
rust-version = "1.91.0"
edition = "2024"

authors = ["NVIDIA"]
license = "Apache-2.0"

[workspace.dependencies]
# almost everything also depends on `pin-project-lite`
pin-project-lite = { version = "0.2", default-features = false }

tonic = { version = "~0.14", default-features = false }
tonic-prost = { version = "~0.14", default-features = false }
tonic-prost-build = { version = "~0.14", default-features = false }
prost = { version = "~0.14", default-features = false }
prost-types = { version = "~0.14", default-features = false }

# note: we don't depend on `tower` directly, as many other crates do with a lot
# of different versions. `tower-layer` and `tower-service` are more stable.

# `tonic` also depends on `tower-layer`
tower-layer = { version = "0.3.3", default-features = false }
# `tonic` also depends on `tower-service`
tower-service = { version = "0.3.3", default-features = false }

# `tonic` depends on `h2` via `hyper`, see
# https://github.com/hyperium/tonic/blob/v0.14.5/tonic/Cargo.toml#L76-L77
h2 = { version = "0.4", default-features = false }
hyper = { version = "1", default-features = false }

http = { version = "1.3.0", default-features = false }
http-body = { version = "1.0", default-features = false }
bytes = { version = "1.10", default-features = false }

# `tonic` also depends on `tracing`
tracing = { version = "~0.1", default-features = false }

# warning: `tracing-opentelementry` and `opentelemetry` must track each other,
# and not by version number. otherwise, horrible things happen.
tracing-opentelemetry = { version = "~0.32", default-features = false }
# `tracing-opentelemetry` also depends on `opentelemetry`
opentelemetry = { version = "~0.31", default-features = false }
opentelemetry_sdk = { version = "~0.31", default-features = false }
opentelemetry-semantic-conventions = { version = "~0.31", default-features = false, features = [
    "semconv_experimental",
] }
opentelemetry-otlp = { version = "~0.31", default-features = false }
opentelemetry-appender-tracing = { version = "~0.31", default-features = false }

tracing-subscriber = { version = "0.3", default-features = false }

serde = { version = "1", default-features = false, features = ["std"] }
serde_json = { version = "1", default-features = false }

time = { version = "0.3", default-features = false }
# warning: due to being in the same repo, it's highly advisable the axum version
# tracks the one that tonic uses. this ought not to be a requirement, but i
# haven't tested if a version mismatch works. see
# ```
# cargo tree --package 'axum' --invert
# ```
axum = { version = "~0.8", default-features = false }

# --- integ only

pretty_assertions = { version = "1.4" }

tonic-build = { version = "~0.14" }
tonic-health = { version = "~0.14" }
tonic-reflection = { version = "~0.14" }

tokio = { version = "1.47", default-features = false }
futures = { version = "0.3", default-features = false }

tower = { version = "0.5", default-features = false }

reqwest = { version = "0.12", default-features = false }
fastrand = { version = "2.3", default-features = false }
hex = { version = "0.4", default-features = false }

# if this is bumped, the `tonic` and `axum` versions in
# `crates/otel-asserts/Cargo.toml` must be re-aligned
opentelemetry-proto = { version = "~0.31", default-features = false }
