[package]
name = "otel-tools"
description = "OpenTelemetry helpers and setup"

version.workspace = true
rust-version.workspace = true
edition.workspace = true

authors.workspace = true
license.workspace = true

autobins = false
autoexamples = false
autobenches = false

include = ["/src", "/LICENSE.txt"]
readme = "../../README.md"
homepage = "https://github.com/NVIDIA-Omniverse/usd-content-workspace/tree/main/common/observability"
repository = "https://github.com/NVIDIA-Omniverse/usd-content-workspace/tree/main/common/observability"

publish = ["ct-omniverse-cargo-local"]

[features]
default = ["otlp"]
otlp = ["dep:http", "dep:opentelemetry-otlp", "opentelemetry_sdk/rt-tokio"]

[dependencies]
tonic = { workspace = true, default-features = false, features = ["codegen"] }
tracing = { workspace = true, default-features = false }
tracing-subscriber = { workspace = true, default-features = false, features = [
    "fmt",
    "env-filter",
    "registry",
] }
tracing-opentelemetry = { workspace = true, default-features = false }
opentelemetry = { workspace = true, default-features = false }
opentelemetry_sdk = { workspace = true, default-features = false, features = [
    "logs",
    "trace",
    "metrics",
    "rt-tokio",
    "experimental_metrics_periodicreader_with_async_runtime",
    "experimental_logs_batch_log_processor_with_async_runtime",
    "experimental_trace_batch_span_processor_with_async_runtime",
] }
opentelemetry-semantic-conventions = { workspace = true, default-features = false, features = [
    "semconv_experimental",
] }
opentelemetry-appender-tracing = { workspace = true, default-features = false, features = [
    "experimental_use_tracing_span_context",
] }
opentelemetry-otlp = { workspace = true, optional = true, default-features = false, features = [
    "logs",
    "metrics",
    "trace",
    "grpc-tonic",
    "http-json",
    "http-proto",
    "reqwest-client",
] }
http = { workspace = true, optional = true }

serde = { workspace = true, default-features = false, features = ["std"] }
serde_json = { workspace = true, default-features = false, features = ["std"] }
time = { workspace = true, default-features = false, features = ["formatting"] }

[dev-dependencies]
otel-asserts = { path = "../otel-asserts" }

pretty_assertions = { workspace = true }

# the `identify_callsite!()` macro is not exported by tracing?
tracing-core = "*"
tokio = { workspace = true, default-features = false, features = [
    "net",
    "sync",
    "rt-multi-thread",
] }
