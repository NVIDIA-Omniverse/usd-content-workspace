[package]
name = "tonic-observability"
description = "Tracing and metric layers for Tonic-based gRPC clients and servers"

version.workspace = true
rust-version.workspace = true
edition.workspace = true

authors.workspace = true
license.workspace = true

autobins = false
autoexamples = false
autobenches = false

include = ["/src", "/LICENSE.txt"]
readme = "../../README.md"
homepage = "https://github.com/NVIDIA-Omniverse/usd-content-workspace/tree/main/common/observability"
repository = "https://github.com/NVIDIA-Omniverse/usd-content-workspace/tree/main/common/observability"

publish = ["ct-omniverse-cargo-local"]

[features]
# extremely verbose logging - not recommended!
verbose = []
# draft proposal
traceresponse = []
default = []

[dependencies]
otel-tools = { version = "0.14.0", default-features = false, path = "../otel-tools" }

pin-project-lite = { workspace = true, default-features = false }
tonic = { workspace = true, default-features = false, features = [
    "codegen",
    "transport",
] }
prost = { workspace = true, default-features = false }
prost-types = { workspace = true, default-features = false, features = ["std"] }
tower-layer = { workspace = true, default-features = false }
tower-service = { workspace = true, default-features = false }
h2 = { workspace = true, default-features = false }
hyper = { workspace = true, default-features = false }
http-body = { workspace = true, default-features = false }
bytes = { workspace = true, default-features = false }
tracing = { workspace = true, default-features = false }
opentelemetry = { workspace = true, default-features = false }
opentelemetry-semantic-conventions = { workspace = true, default-features = false, features = [
    "semconv_experimental",
] }

[dev-dependencies]
otel-asserts = { path = "../otel-asserts" }
otel-tools = { path = "../otel-tools", default-features = false, features = [
    "otlp",
] }
protos = { path = "../protos" }
testing = { path = "../testing" }
tonic-observability = { path = "../tonic-observability", features = [
    "verbose",
] }

tonic = { workspace = true, default-features = false, features = [
    "router",
    "gzip",
] }
tracing-opentelemetry = { workspace = true, default-features = false }
tracing-subscriber = { workspace = true, default-features = false }
tokio = { workspace = true, default-features = false, features = [
    "net",
    "sync",
    "rt-multi-thread",
] }
tower = { workspace = true }
futures = { workspace = true, default-features = false, features = ["std"] }
axum-core = { version = "*" }
hyper-util = { version = "*" }
