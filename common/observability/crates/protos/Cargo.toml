[package]
name = "protos"

version = "0.0.0"
rust-version.workspace = true
edition.workspace = true

authors.workspace = true
license.workspace = true

publish = false

autobins = false
autoexamples = false
autobenches = false

[lib]
doctest = false
bench = false
doc = false

[dependencies]
tonic = { workspace = true, default-features = false, features = ["codegen"] }
tonic-prost = { workspace = true, default-features = false }
prost = { workspace = true, default-features = false, features = ["derive"] }

[build-dependencies]
tonic-prost-build = { workspace = true, default-features = false }
