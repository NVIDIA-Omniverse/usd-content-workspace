apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "permission-ui.fullname" . }}
  labels:
    {{- include "permission-ui.labels" . | nindent 4 }}
data:
  main.json: |
    {{- $clientRegYaml := include "permission-ui.clientRegistration" . }}
    {{- $clientReg := $clientRegYaml | fromYaml }}
    {
      "auth": {
        "clientId": "{{ $clientReg.clientId }}",
        "authority": "{{ include "permission-ui.authAuthority" . }}",
        "redirectUri": "{{ include "permission-ui.redirectUri" . }}",
        "scope": "{{ $clientReg.scope }}"
      },
      "endpoints": {
        {{- if and .Values.httpProxy.enabled (empty .Values.config.endpoints.backend) -}}
        "backend": "{{ ternary "https://" "http://" .Values.httpProxy.tls.enabled }}permissions.{{ .Values.httpProxy.fqdn.domain }}"
        {{- else -}}
        "backend": "{{ .Values.config.endpoints.backend }}"
        {{- end -}}
        {{- if .Values.userService.enabled -}}
        {{- if and .Values.httpProxy.enabled (empty .Values.userService.endpoint) -}}
        ,"userService": "{{ ternary "https://" "http://" .Values.httpProxy.tls.enabled }}userinfo.{{ .Values.httpProxy.fqdn.domain }}"
        {{- else -}}
        ,"userService": "{{ .Values.userService.endpoint }}"
        {{- end -}}
        {{- end -}}
      }
    }

  nginx.conf: |
    http {
      include /usr/local/nginx/conf/mime.types;
      disable_symlinks off;

      server {
        listen {{ .Values.service.port }};
        server_name localhost;
        client_max_body_size 32m;
        client_body_buffer_size 128k;
        client_header_buffer_size 5120k;
        large_client_header_buffers 16 5120k;

        root /var/www/html;

        location / {
            {{- if .Values.config.csp }}
          add_header Strict-Transport-Security max-age=3600;
          add_header Content-Security-Policy "{{ .Values.config.csp }}";
            {{- end }}
          try_files $uri /index.html;
        }
      }
    }

    events {}
