apiVersion: v1
kind: Service
metadata:
  name: {{ include "permissions.servicename" . }}
  labels:
    {{- include "permissions.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.ports.http }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.ports.grpc }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "permissions.selectorLabels" . | nindent 4 }}
