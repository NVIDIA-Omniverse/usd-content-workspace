{{- $renderRemapper := and .Values.config.urlRemapper.enabled (not .Values.config.urlRemapper.rewriteRulesRef.name) -}}
{{- if or .Values.database.init.policies .Values.database.init.services $renderRemapper }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "permissions.fullname" . }}-config-files
  labels:
    {{- include "permissions.labels" . | nindent 4 }}
data:
  {{- if .Values.database.init.policies }}
  policies.yaml: |
    policies:
    {{- .Values.database.init.policies | toYaml | nindent 4 }}
  {{- end }}
  {{- if .Values.database.init.services }}
  metadata.yaml: |
    services:
      {{- .Values.database.init.services | toYaml | nindent 4 }}
  {{- end }}
  {{- if $renderRemapper }}
  url-remapper.yaml: |
    enabled: true
    rewriteRules:
      {{- toYaml .Values.config.urlRemapper.rewriteRules | nindent 6 }}
  {{- end }}
{{- end }}

