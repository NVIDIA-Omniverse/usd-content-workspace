[package]
name = "permission-auth"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

publish = ["ct-omniverse-cargo-local"]

[dependencies]
clap = { workspace = true, features = ["derive", "env"] }
jsonwebtoken = { workspace = true }
humantime = { workspace = true }
moka = { workspace = true, features = ["future"] }
permission-core = { workspace = true }
reqwest = { workspace = true, features = ["json", "default-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true, features = ["parsing"] }
tokio = { workspace = true }
tonic = { workspace = true, optional = true }
tracing = { workspace = true }

[features]
# Outbound gRPC client auth interceptors built on top of `service_identity`.
grpc = ["dep:tonic", "tokio/fs", "tokio/sync", "tokio/time"]

[dev-dependencies]
tempfile = "3.26.0"
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = "0.6.5"
