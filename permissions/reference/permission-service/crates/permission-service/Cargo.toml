[package]
name = "permission-service"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Define the library part of the crate
[lib]
name = "permission_service"
path = "src/lib.rs"

# Define the main binary
[[bin]]
name = "permission-service"
path = "src/main.rs"

# Define the OpenAPI generator binary
[[bin]]
name = "openapi-generator"
path = "src/bin/openapi_generator.rs"

# Define the conformance test setup binary
[[bin]]
name = "conformance-test-setup"
path = "src/bin/conformance_test_setup.rs"
test = false

[dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
axum = "0.8.7"
axum-observability = { version = "0.14.0", path = "../../vendor/axum-observability" }
cedar-policy = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
deadpool-postgres = { workspace = true }
garde = { workspace = true }
humantime = { workspace = true }
jsonwebtoken = { workspace = true }
moka = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-http = { workspace = true }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic"] }
opentelemetry-semantic-conventions = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }
permission-auth = { path = "../permission-auth", features = ["grpc"] }
permission-core = { path = "../permission-core" }
permission-db = { path = "../permission-db" }
permission-service-capabilities-proto = { path = "../permission-service-capabilities-proto" }
permission-service-notification-proto = { path = "../permission-service-notification-proto" }
permission-service-proto = { path = "../permission-service-proto" }
prost-types = { workspace = true }
rayon = "1.10.0"
reqwest = { workspace = true, features = ["json", "default-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-postgres = { workspace = true }
tokio-postgres-rustls = "0.13"
tokio-stream = { workspace = true }
tonic = { workspace = true, features = ["tls-ring", "tls-native-roots"] }
tonic-health = { workspace = true }
tonic-reflection = { workspace = true }
tonic-async-interceptor = "0.14.1"
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace", "cors"] }
tracing = { workspace = true }
tracing-core = "0.1.33"
tracing-log = "0.2.0"
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = [
  "env-filter",
  "ansi",
  "tracing-log",
] }
utoipa = { workspace = true }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
once_cell = "1.21.3"
time = { version = "0.3.39", features = ["formatting"] }

[dev-dependencies]
axum-test = "18.4.1"
jsonwebkey = { version = "0.3.5", features = ["generate", "jwt-convert"] }
once_cell = "1.21.3"
tempfile = "3.26.0"
wiremock = "0.6.5"
