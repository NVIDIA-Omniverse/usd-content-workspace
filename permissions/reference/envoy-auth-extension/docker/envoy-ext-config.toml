[server]
ip_address = "0.0.0.0"
port = 50051
username_claims = ["preferred_username"]
user_id_header = "user-id"
username_header = "username"
username_source_claim_header = "username-source-claim"

[server.tonic]
initial_connection_window_size = 65535
initial_stream_window_size = 65535
max_decoding_message_size = 4194304

[auth]
authentication_type = "jwt"
jwt_audience = []
token_cache_size = 2048
openid_configuration = "https://login.microsoftonline.com/43083d15-7273-40c1-b7db-39efd9ccc17a/v2.0/.well-known/openid-configuration"

[auth.jwks_ttl]
secs = 3600
nanos = 0

[auth.token_ttl]
secs = 3600
