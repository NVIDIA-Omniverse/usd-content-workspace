---
name: envoy-auth-extension

services:
  envoy-auth-ext-service:
    build:
      context: ..
      dockerfile: docker/envoy-auth-ext.Dockerfile
      args:
        # Set GENERATE_LICENSES=true to render the license attributions into the
        # image (5-10 minutes). It needs scripts/generate_licenses.py, which is
        # internal tooling and not part of the published source.
        GENERATE_LICENSES: ${GENERATE_LICENSES:-false}
      tags:
        - latest
    ports:
      - "50051:50051"
    volumes:
      - ${PWD}/docker/envoy-ext-config.toml:/app/envoy-ext-config.toml:ro
    networks:
      - envoy-auth-network
    environment:
      - OTEL_SERVICE_NAME=envoy-auth-ext-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-gateway:4317
      - BUNYAN=true
      - LOG_LEVEL="debug"  # Log verbosity (trace, debug, info, warn, error)
      - OPENID_CONFIGURATION=""
      # - JWKS_URI=""  # The endpoint from the identity provider for downloading public keys (JSON Web Key Sets).
      - JWKS_TTL_SECS="3600" # Time in seconds for caching public keys retrieved from the identity providers (3600 by default -- 1 hour).
      - JWT_AUDIENCE=[]  # The expected value of aud claim in JWTs passed in the Authorization header.
      - JWT_CACHE_SIZE="2048"  # The LRU cache size for validated JWT and their principals (2048 by default).

