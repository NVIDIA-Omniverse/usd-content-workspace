---
extensions:
  health_check:

receivers:
  # Data sources: traces, metrics
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317


processors:
  batch/traces:
    timeout: 15s
    send_batch_size: 1000
  batch/metrics:
    timeout: 60s
  batch/logs:
    send_batch_size: 1024
    timeout: 5s
  attributes:
    actions:
      - key: stack.environment
        value: local
        action: insert


exporters:
  # Data sources: traces, metrics, logs
  debug:
    verbosity: detailed

  otlp/jaeger:
    endpoint: "jaeger-all-in-one:4317"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch/traces, attributes]
      exporters: [debug, otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch/metrics, attributes]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch/logs]
      exporters: [debug]
  extensions: [health_check]
