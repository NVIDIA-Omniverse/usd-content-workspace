[server]
ip_address = "0.0.0.0"
port = 50051

[server.tonic]
initial_connection_window_size = 65535
initial_stream_window_size = 65535
max_decoding_message_size = 4194304

[auth]
authentication_type = "opaque"
jwt_audience = []
openid_configuration = "http://mock-idp/.well-known/openid-configuration"
token_cache_size = 2048

[auth.jwks_ttl]
secs = 3600
nanos = 0

[auth.token_ttl]
secs = 3600
