---
name: envoy-auth-extension-testing

services:
  mock-idp:
    image: python:3.14-alpine@sha256:3f818d6811ff5f3f2b5e5d836df3d25c2dd2e588d3b4981338a8ba17e422f74f
    command:
      - python
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, HTTPServer

        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                if self.path == "/.well-known/openid-configuration":
                    body = json.dumps({
                        "issuer": "http://mock-idp",
                        "jwks_uri": "http://mock-idp/jwks",
                        "token_endpoint": "http://mock-idp/token",
                        "userinfo_endpoint": "http://mock-idp/userinfo",
                    }).encode()
                    status = 200
                elif self.path == "/userinfo" and self.headers.get("Authorization") == "Bearer valid-token":
                    body = json.dumps({"sub": "integration-user"}).encode()
                    status = 200
                else:
                    body = json.dumps({"error": "unauthorized"}).encode()
                    status = 401
                self.send_response(status)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def log_message(self, format, *args):
                pass

        HTTPServer(("0.0.0.0", 80), Handler).serve_forever()
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1/.well-known/openid-configuration
      interval: 1s
      timeout: 1s
      retries: 10
    networks:
      - envoy-auth-test-network

  envoy-auth-ext-service-test:
    build:
      context: ..
      dockerfile: docker/envoy-auth-ext.Dockerfile
      tags:
        - latest
    container_name: envoy-auth-ext-service-test
    ports:
      - "59051:50051"
    volumes:
      - ${PWD}/test/envoy-ext-config-test.toml:/app/envoy-ext-config.toml:ro
    depends_on:
      mock-idp:
        condition: service_healthy
    networks:
      - envoy-auth-test-network
    environment:
      - OTEL_SERVICE_NAME=envoy-auth-ext-service
      - OTEL_SDK_DISABLED=true
      - BUNYAN=true
      - LOG_LEVEL=debug  # Log verbosity (trace, debug, info, warn, error)

networks:
  envoy-auth-test-network: {}
