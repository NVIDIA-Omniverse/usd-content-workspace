# Vendored from permission-core 0.0.54-rc.3 (permission-service); see README.md.

[package]
edition = "2021"
rust-version = "1.88.0"
name = "permission-core"
version = "0.0.54-rc.3"
authors = ["NVIDIA"]
build = false
publish = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA-Omniverse/usd-content-workspace/tree/main/permissions/reference/permission-service"

[lib]
name = "permission_core"
path = "src/lib.rs"

[dependencies.cedar-policy]
version = "4.4.1"
features = [
    "default",
    "partial-eval",
]

[dependencies.garde]
version = "0.22.1"
features = [
    "derive",
    "pattern",
    "regex",
]

[dependencies.md-5]
version = "0.10.6"

[dependencies.moka]
version = "0.12.10"
features = ["sync"]

[dependencies.serde]
version = "1.0.218"

[dependencies.serde_json]
version = "1.0.139"

[dependencies.tracing]
version = "0.1.43"
features = ["attributes"]
default-features = false

[dependencies.url]
version = "2.5.4"

[dependencies.urlencoding]
version = "2.1.3"

[dependencies.utoipa]
version = "5.4.0"
