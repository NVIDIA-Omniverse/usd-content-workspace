[workspace]
resolver = "2"
members = ["crates/*"]
# Vendored first-party crates (see vendor/*/README.md); built as path dependencies only.
exclude = ["vendor"]

[workspace.package]
version = "2.4.1"
authors = ["NVIDIA"]
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.dependencies]
# dev
prost-types = "0.14"
permission-auth = { version = "=0.0.54-rc.3", path = "vendor/permission-auth" }
# regular
clap = { version = "4.6" }
config = { version = "0.15", default-features = false, features = [
    "json",
    "toml",
] }
prost = "0.14"
reqwest = "0.12"
serde = "1.0"
serde_json = "1.0"
tokio = "1.53"
tokio-stream = "0.1"
toml = "1.1"
tonic = "0.14"
tonic-health = "0.14"
tonic-reflection = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"

# Observability / OTEL
otel-tools = { version = "0.14.0", path = "vendor/otel-tools" }
tonic-observability = { version = "0.14.0", path = "vendor/tonic-observability" }
# warning: `tracing-opentelementry` and `opentelemetry` must track each other,
# and not by version number. otherwise, horrible things happen.
# (e.g. tracing-opentelemetry 0.28 needs opentelemetry 0.27)
# tracing-opentelemetry = { version = "0.28", default-features = false }
# `tracing-opentelemetry` also depends on `opentelemetry`
opentelemetry = { version = "0.31", default-features = false }
tracing = { version = "0.1.41", default-features = false, features = [
    "attributes",
] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "std",
    "fmt",
    "registry",
] }
opentelemetry_sdk = { version = "0.31", default-features = false }
opentelemetry-otlp = { version = "0.31" }
base64 = "0.23"
