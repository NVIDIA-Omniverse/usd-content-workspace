[pytest]
asyncio_default_fixture_loop_scope = function
testpaths = tests
addopts = -n auto
# Starlette 1.x deprecates its httpx-based TestClient in favor of httpx2; the
# warning is test-only and third-party. Suppress by message (not class) so this
# parses regardless of the installed starlette version.
filterwarnings =
    ignore:Using .httpx. with .starlette.testclient. is deprecated