repos:
  - repo: local
    hooks:
      - id: generate-openapi
        name: Generate OpenAPI YAML
        entry: uv run generate_openapi_yaml
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: add-openapi
        name: Add OpenAPI YAML to commit
        entry: git add openapi.yaml
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: no-home-absolute-paths
        name: No laptop-absolute paths (/Users/<user>/, /home/<user>/) in tracked files
        entry: '/(Users|home)/[A-Za-z0-9_-]+/'
        language: pygrep
        types: [text]
        stages: [pre-commit]

