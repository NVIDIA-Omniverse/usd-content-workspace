## Smoke test base image configuration
## Used for running helm test without building a custom test image.
## See SMOKE_TESTS.md in the project root for smoke test documentation.
smokeTest:
  image:
    ## @param smokeTest.image.repository Smoke test base image repository
    repository: nvcr.io/nvidia/omniverse/smoke-test-base
    ## @param smokeTest.image.tag Smoke test base image tag
    tag: "1.0.1"
    ## @param smokeTest.image.pullPolicy Image pull policy. Allowed values: Always, IfNotPresent, Never
    pullPolicy: IfNotPresent
    ## @param smokeTest.image.pullSecrets Pull secrets for the smoke test image
    pullSecrets: []
    #  - name: secret
  ## @param smokeTest.podLabels Labels applied to the smoke-test pod only (not the main Deployment).
  ## Required for workload-identity: the Azure mutating webhook injects the
  ## projected token volume/env only into pods carrying
  ## `azure.workload.identity/use: "true"`. Falls back to `.Values.podLabels`
  ## when unset.
  podLabels: {}
  # Example:
  # podLabels:
  #   azure.workload.identity/use: "true"
## Test suite configuration (smoke tests)
## Deploys a test pod that runs smoke tests against the Event Consumer Service
## only (REST and gRPC). See SMOKE_TESTS.md for details.
tests:
  ## @param tests.enabled Enable/disable test suite.
  enabled: false
  ## Dedicated ServiceAccount for the smoke-test Job. Separate from the
  ## main service SA so the test runs under its own AAD identity — the
  ## smoke-test is a client of event-consumer-service, not the service
  ## itself.
  serviceAccount:
    ## Whether to create the SA. Set to false to bind to a pre-existing SA
    ## via `name` below.
    create: true
    ## Override the generated SA name. Defaults to `<fullname>-test-smoke`.
    name: ""
    ## Annotations on the SA (e.g. `azure.workload.identity/client-id`).
    annotations: {}
    ## Automatically mount the SA's API credentials.
    automount: true
  ## Workload-identity for the smoke-test pod. Independent from the main
  ## service's identity — the smoke-test has its own SA (above) and its
  ## own sidecar toggle here.
  serviceIdentity:
    accessTokenFile:
      ## @param tests.serviceIdentity.accessTokenFile.enabled Enable the access-token-file flow for smoke-test.
      enabled: false
      provisionerSidecar:
        ## Container spec for the token-provisioner sidecar. Rendered as a
        ## K8s 1.29+ native sidecar (an initContainer with
        ## `restartPolicy: Always`). The chart adds a `token-exchange`
        ## volumeMount; `name` and `restartPolicy` are controlled by the
        ## chart and any values supplied here for those keys are ignored.
        ##
        ## CONTRACT: the sidecar MUST write the token to
        ## `/etc/secrets/access-token/token` — that path is hardcoded in
        ## the test container's read side (SMOKE_TESTS_ACCESS_TOKEN_FILE_PATH).
        ## Set the sidecar's `TOKEN_OUTPUT_PATH` env to exactly that path;
        ## a mismatch makes the test wait the full 30s and then fail.
        container: {}
        # Example:
        # container:
        #   image: nvcr.io/.../client-credentials-sidecar:0.0.4
        #   env:
        #     - name: AZURE_TENANT_ID
        #       value: <tenant-uuid>
        #     - name: OAUTH2_CLIENT_ID
        #       value: <client-id>
        #     - name: OAUTH2_SCOPE
        #       value: <resource-app-id>/.default
        #     - name: AUTH_MODE
        #       value: workload-identity
        #     - name: TOKEN_OUTPUT_PATH
        #       value: /etc/secrets/access-token/token
  ## @param tests.runGrpcTests Enable or disable gRPC tests.
  runGrpcTests: true
  ## @param tests.runRestTests Enable or disable REST tests.
  runRestTests: true
  ## @param tests.timeout Request timeout in seconds.
  timeout: ""
  ## Event Consumer Service REST endpoint (optional override).
  ## If set — always used. If not set — default: when httpProxy.enabled use
  ## ingress URL; when ingress off use in-cluster service URL.
  restConsumerEndpoint: ""
  ## Event Consumer Service gRPC endpoint (optional override). If set — always
  ## used. If not set — in-cluster or ingress grpc URL. Required for gRPC tests.
  grpcConsumerEndpoint: ""
  ## @param tests.grpcSkipTls Skip TLS verification for gRPC (e.g. "true").
  grpcSkipTls: ""
  ## @param tests.ttlSecondsAfterFinished Seconds after the smoke test Job completes
  ## (Succeeded or Failed) before it is cleaned up. 0 = do not delete automatically.
  ## Default: 900 (15 minutes). Type: integer.
  ttlSecondsAfterFinished: 900
  ## Token authentication for smoke tests (optional). Required when consumer
  ## has auth enabled (openId.enabled). Use OAuth 2.0 client credentials;
  ## each property accepts value or valueFrom (e.g. secretKeyRef).
  auth: {}
  # microsoftUrl:
  #   value: "https://login.microsoftonline.com/.../v2.0/.well-known/openid-configuration"
  # credentials:
  #   valueFrom:
  #     secretKeyRef:
  #       name: "smoke-test-oauth"
  #       key: "credentials"
  # scope:
  #   value: "<client-id>/.default"
## Secrets Store CSI Driver integration
secrets:
  ## CSI Driver configuration for external secret management
  csi:
    ## @param secrets.csi.enabled Enable Secrets Store CSI Driver integration
    ## Type: boolean. Default: false. Requires CSI driver installed in cluster.
    enabled: false
    ## @param secrets.csi.secretProviderClassName Name of the SecretProviderClass
    ## Type: string. Required if secrets.csi.enabled is true.
    ## Must reference an existing SecretProviderClass resource.
    secretProviderClassName: ""
    ## @param secrets.csi.volumeName Volume name for the secrets mount
    ## Type: string. Default: secrets-store-inline
    volumeName: "secrets-store-inline"
    ## @param secrets.csi.mountPath Path where secrets will be mounted in container
    ## Type: string. Default: /mnt/secrets-store
    mountPath: "/mnt/secrets-store"
