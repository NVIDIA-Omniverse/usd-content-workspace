apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "event-consumer-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "event-consumer-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.channelPoolAutoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "event-consumer-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checkov.io/skip: CKV_K8S_35=Secrets passed as env vars by design
        checksum/config: {{ include (print $.Template.BasePath "/settings-configmap.yaml") . | sha256sum }}
        checksum/granular-permissions: {{ include (print $.Template.BasePath "/granular-permissions-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ (lookup "v1" "Secret" .Release.Namespace .Values.envSecretName) | toJson | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "event-consumer-service.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- $teardownTailSeconds := 10.0 }}
      {{- /*
      Reject the removed shutdown.preStopDelaySeconds key rather than
      silently ignoring it: an operator who still sets it would otherwise
      get the settle delay's default on top of whatever they configured,
      with no signal. This guard is permanent until someone decides the
      migration window has closed -- it is not dead code.
      */ -}}
      {{- if not (kindIs "invalid" .Values.shutdown.preStopDelaySeconds) }}
      {{- fail (printf "shutdown.preStopDelaySeconds has been removed. The endpoint-settle delay is applied by the application on SIGTERM instead of by a Kubernetes lifecycle.preStop.sleep handler; set shutdown.settleDelaySeconds instead (same meaning, same default of 15). Re-check shutdown.terminationGracePeriodSeconds against the new bound: settleDelaySeconds + drainWindowSeconds + %vs post-drain teardown." $teardownTailSeconds) }}
      {{- end }}
      {{- /*
      Bounds-check the shutdown values at render time. They reach the app as
      ConfigMap strings rather than as API-server-validated pod fields, so a
      negative, empty or non-numeric value renders cleanly here and then fails
      the library's field validation at process start -- a CrashLoopBackOff
      and a stalled rollout instead of an immediate template error. The
      accepted ranges mirror notification_common CommonSettings exactly: the
      settle and the drain window take any value >= 0 (0 skips the phase), the
      poll interval is a cadence and must be > 0. The test is on the rendered
      text, not on the value's type, because --set delivers a float as a
      string ("0.5") while a values file delivers it as a number -- both are
      legitimate, and only the sign and the digits distinguish them from a
      typo. The pattern rejects a leading "-" too, so a negative fails here
      rather than silently shrinking the grace-period bound below.

      The pattern accepts exponent notation, which lets a value out of float64
      range ("1e400", "1e-400") through the text test while sprig's float64
      swallows ParseFloat's range error and yields 0 -- so the grace-period
      invariant below would compute against 0 and pass, and the ConfigMap
      would carry the text to pydantic, which reads it as inf and settles
      until SIGKILL. Text that is numeric and does not spell zero yet
      converts to 0 is exactly that overflow/underflow signature, so it is
      rejected here as non-finite.
      */ -}}
      {{- range $key, $exclusive := dict "settleDelaySeconds" false "drainWindowSeconds" false "drainPollIntervalSeconds" true }}
      {{- $value := index $.Values.shutdown $key }}
      {{- $numeric := regexMatch "^\\+?([0-9]+(\\.[0-9]*)?|\\.[0-9]+)([eE][-+]?[0-9]+)?$" (printf "%v" $value) }}
      {{- $zero := regexMatch "^\\+?(0+(\\.0*)?|\\.0+)([eE][-+]?[0-9]+)?$" (printf "%v" $value) }}
      {{- if and $numeric (not $zero) (eq ($value | float64) 0.0) }}
      {{- fail (printf "shutdown.%s must be a finite number (got %v)" $key $value) }}
      {{- end }}
      {{- if or (not $numeric) (and $exclusive (eq ($value | float64) 0.0)) }}
      {{- fail (printf "shutdown.%s must be a number %s (got %v)" $key (ternary "> 0" ">= 0" $exclusive) $value) }}
      {{- end }}
      {{- end }}
      {{- /*
      Enforce the coupled-knob drain invariant at render time so a
      misconfiguration fails the template instead of SIGKILLing the pod
      mid-shutdown in production. The grace period is spent in order -- the
      app-side settleDelaySeconds settle, then the up-to-drainWindowSeconds
      app drain, then the post-drain server teardown -- so it must cover all
      three terms. drainWindowSeconds is a float, so all terms are compared
      in float64 arithmetic to avoid a truncation false-trip.

      The teardown tail is a fixed property of the library's shutdown
      implementation, not a deployment knob, so it is a template constant
      rather than a value. Its two legs run concurrently once the drain ends:
      the gRPC server's stop grace (notification_server.py, stop(grace=5))
      and the REST teardown, whose longest step is the default lifespan
      shutdown sleep (notification_rest_server.py, _default_lifespan, 5s).
      10s covers the longer of the two with margin -- re-derive it whenever
      either of those library values changes. After both legs return, the
      client close runs (start_servers.py, _close_clients: the RabbitMQ
      connector, the shared HTTP client, then the Redis client); it is
      normally sub-second, and the roughly 5s of slack the 10s term carries
      over the ~5s concurrent legs absorbs it at every grace period the guard
      admits, including one set exactly at the floor. What the term
      deliberately does NOT cover is that close blocking on an unresponsive
      broker, nor uvicorn's unbounded wait for open connections; only margin
      above the floor pays for those. See the
      shutdown.terminationGracePeriodSeconds prose in values.yaml.

      Re-deriving the constant is not a one-file change: the number is a
      literal here and is restated in prose this template cannot
      interpolate, so update these in the same pass -- the shutdown.*
      "## @param" blocks in values.yaml, the README section "Graceful drain
      on scale-down and rollout", the source repository's internal design
      and requirements docs (not published), the shutdown entries
      in CHANGELOG.md, and the TEARDOWN_TAIL_SECONDS constant in
      tests/helm/test_drain_lifecycle_template.py, which is asserted against
      the fail message text above and is the one surface that fails loudly.
      */ -}}
      {{- $grace := .Values.shutdown.terminationGracePeriodSeconds | float64 }}
      {{- $required := addf (.Values.shutdown.settleDelaySeconds | float64) (.Values.shutdown.drainWindowSeconds | float64) $teardownTailSeconds }}
      {{- if lt $grace $required }}{{ fail (printf "shutdown.terminationGracePeriodSeconds (%v) must be >= shutdown.settleDelaySeconds (%v) + shutdown.drainWindowSeconds (%v) + %vs post-drain teardown" .Values.shutdown.terminationGracePeriodSeconds .Values.shutdown.settleDelaySeconds .Values.shutdown.drainWindowSeconds $teardownTailSeconds) }}{{ end }}
      # Total shutdown budget, from pod deletion to SIGKILL. It must cover all
      # three phases, which run in order: the settleDelaySeconds settle, the
      # up-to-drainWindowSeconds drain, then a fixed {{ $teardownTailSeconds }}s post-drain server
      # teardown. The chart enforces that at render time; the full derivation is
      # in the shutdown.terminationGracePeriodSeconds prose in values.yaml.
      terminationGracePeriodSeconds: {{ .Values.shutdown.terminationGracePeriodSeconds }}
      {{- include "event-consumer-service.imagePullSecrets" ( dict "images" (list .Values.image) "global" .Values) | nindent 6 }}
      serviceAccountName: {{ include "event-consumer-service.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpc.port }}
              protocol: TCP
            {{- if .Values.service.rest.enabled }}
            - name: http
              containerPort: {{ .Values.service.rest.port }}
              protocol: TCP
            {{- end }}
          envFrom:
          - configMapRef:
              name: {{ include "event-consumer-service.fullname" . }}-settings
          env:
            - name: OMNI_EVENTS_RABBITMQ_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.envSecretName }}
                  key: rabbitmq_uri
            {{- if .Values.redis.enabled }}
            - name: OMNI_EVENTS_REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.envSecretName }}
                  key: redis_uri
            {{- end }}

          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
          {{- if .Values.volumeMounts }}
            {{- toYaml .Values.volumeMounts | nindent 12 }}
          {{- end }}
          {{- if .Values.secrets.csi.enabled }}
            - name: {{ .Values.secrets.csi.volumeName }}
              mountPath: {{ .Values.secrets.csi.mountPath }}
              readOnly: true
          {{- end }}
            - name: granular-permissions-volume
              mountPath: {{ .Values.permissions.yaml_file_path }}
              subPath: {{ base .Values.permissions.yaml_file_path }}
              readOnly: true
      volumes:
      {{- if .Values.volumes }}
        {{- toYaml .Values.volumes | nindent 8 }}
      {{- end }}
      {{- if .Values.secrets.csi.enabled }}
        - name: {{ .Values.secrets.csi.volumeName }}
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.secrets.csi.secretProviderClassName | quote }}
      {{- end }}
        - name: granular-permissions-volume
          configMap:
            name: {{ include "event-consumer-service.fullname" . }}-granular-permissions
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
