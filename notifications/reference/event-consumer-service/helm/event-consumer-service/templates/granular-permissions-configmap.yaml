apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "event-consumer-service.fullname" . }}-granular-permissions
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "event-consumer-service.labels" . | nindent 4 }}
data:
  {{ base .Values.permissions.yaml_file_path }}: |-
    storage_permissions_endpoints:
    {{- if .Values.permissions.storage_permissions.endpoints }}
    {{- toYaml .Values.permissions.storage_permissions.endpoints | nindent 4 }}
    {{- else }} []
    {{- end }}
{{ .Values.permissions.content | nindent 4 }}
