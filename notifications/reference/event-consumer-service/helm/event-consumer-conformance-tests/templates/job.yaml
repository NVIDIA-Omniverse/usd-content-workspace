apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "event-consumer-conformance-tests.fullname" . }}
  labels:
    {{- include "event-consumer-conformance-tests.labels" . | nindent 4 }}
  {{- with .Values.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  {{- if not (kindIs "invalid" .Values.ttlSecondsAfterFinished) }}
  ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "event-consumer-conformance-tests.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: {{ .Values.restartPolicy }}
      serviceAccountName: {{ include "event-consumer-conformance-tests.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: conformance-tests
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: CONFORMANCE_GRPC_ENDPOINT
              value: {{ .Values.service.grpcEndpoint | quote }}
            - name: CONFORMANCE_REST_ENDPOINT
              value: {{ .Values.service.restEndpoint | quote }}
            - name: CONFORMANCE_HEALTH_ENDPOINT
              value: {{ .Values.service.healthEndpoint | quote }}
            - name: CONFORMANCE_AUTH_REQUIRED
              value: {{ .Values.auth.required | quote }}
            - name: CONFORMANCE_STREAM_TIMEOUT
              value: {{ .Values.timeouts.stream | quote }}
            - name: CONFORMANCE_REQUEST_TIMEOUT
              value: {{ .Values.timeouts.request | quote }}
            {{- if .Values.auth.existingSecretName }}
            - name: CONFORMANCE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecretName }}
                  key: {{ .Values.auth.existingSecretKey | default "token" }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
