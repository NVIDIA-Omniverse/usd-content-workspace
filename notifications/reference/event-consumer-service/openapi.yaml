openapi: 3.1.0
info:
  title: Event Consumer API
  description: "\n    REST API for streaming events from the notification service.\n\
    \    Use this API to stream events in real-time using Server-Sent Events (SSE)\n\
    \    "
  version: v1beta
paths:
  /api/v1beta/events/stream:
    get:
      summary: Stream Events
      description: 'Starts a streaming session to receive events using a non-durable
        queue. This means that only events that occur while connected will be consumed.


        **Note on Authorization During Streaming:**

        Authorization errors (401 or 403) can occur at any time during the streaming
        session, not just at the initial connection. For example, if an authentication
        token expires while the stream is active, the server will terminate the connection
        with an authorization error. Clients must handle this by reconnecting to the
        same queue with refreshed credentials. For non-durable queues, use the reconnect_token
        or Last-Event-ID to reconnect to the same queue. For durable queues, simply
        reconnect using the same queue_id.'
      operationId: stream_events_api_v1beta_events_stream_get
      security:
      - HTTPBearer: []
      parameters:
      - name: reconnect_token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
            pattern: ^[\x21-\x7e]{1,200}$
          - type: 'null'
          description: 'Token for reconnecting to the same queue after disconnect.
            This is sent by the client when it is doing a manual reconnection, e.g.
            after a 401 error.


            **Deprecated: send the token in the `Last-Event-ID` request header instead.**
            This parameter still works and will keep working. The header carries the
            same token and supports the same operations, including a filter update.


            Also can be used to consume from the same queue in parallel by multiple
            simultaneous clients


            Pass back a token the server issued, verbatim. A token that is not 1 to
            200 printable ASCII characters is rejected with a 422; the tokens this
            service issues are uuid4s, well inside that. A token of legal shape that
            names no queue is a 404, not a 422.


            NOTE: the queues have a TTL that is configurable and has a 20 second default.'
          deprecated: true
          title: Reconnect Token
        description: 'Token for reconnecting to the same queue after disconnect. This
          is sent by the client when it is doing a manual reconnection, e.g. after
          a 401 error.


          **Deprecated: send the token in the `Last-Event-ID` request header instead.**
          This parameter still works and will keep working. The header carries the
          same token and supports the same operations, including a filter update.


          Also can be used to consume from the same queue in parallel by multiple
          simultaneous clients


          Pass back a token the server issued, verbatim. A token that is not 1 to
          200 printable ASCII characters is rejected with a 422; the tokens this service
          issues are uuid4s, well inside that. A token of legal shape that names no
          queue is a 404, not a 422.


          NOTE: the queues have a TTL that is configurable and has a 20 second default.'
        deprecated: true
      - name: filter_groups
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 65536
          - type: 'null'
          description: "URL-encoded JSON string containing an array of FilterGroup\
            \ objects.\nEach FilterGroup defines filters to apply to events based\
            \ on the event type and optionally the resource id of the messages.\n\
            If omitted, all events will be received.\n\nIf using a reconnect_token\
            \ to reconnect, then this field should be omitted unless\ntrying to change\
            \ the filters from previous values.\n\n**NOTE**: If you are using this\
            \ request to change which\n      filters are being used, you must also\
            \ include the previous filter groups in\n      the \"previous_filter_groups\"\
            \ field.\n\n**Example 1: Basic filter with a single resource filter**\n\
            ```json\n[\n  {\n    \"event_type\": \"my.event.type\",\n    \"filters\"\
            : [\n      {\n        \"filter_type\": \"starts_with_greedy\",\n     \
            \   \"resource_id\": \"folder/\"\n      }\n    ]\n  }\n]\n```\n\n**Example\
            \ 2: Filter with multiple resource filters (OR logic)**\n```json\n[\n\
            \  {\n    \"event_type\": \"my.event.type\",\n    \"filters\": [\n   \
            \   {\n        \"filter_type\": \"starts_with_lazy\",\n        \"resource_id\"\
            : \"folder1/\"\n      },\n      {\n        \"filter_type\": \"eq\",\n\
            \        \"resource_id\": \"specific/path\"\n      }\n    ]\n  }\n]\n\
            ```\n\n**Example 3: Multiple event types with different filters**\n```json\n\
            [\n  {\n    \"event_type\": \"storage.created\",\n    \"filters\": [\n\
            \      {\n        \"filter_type\": \"starts_with_greedy\",\n        \"\
            resource_id\": \"uploads/\"\n      }\n    ]\n  },\n  {\n    \"event_type\"\
            : \"storage.deleted\",\n    \"filters\": [\n      {\n        \"filter_type\"\
            : \"starts_with_lazy\",\n        \"resource_id\": \"temp/\"\n      }\n\
            \    ]\n  }\n]\n```\n\nSee the **FilterGroup**, **ResourceFilter**, and\
            \ **FilterType** schemas in the Components section below for the complete\
            \ structure and field descriptions."
          title: Filter Groups
        description: "URL-encoded JSON string containing an array of FilterGroup objects.\n\
          Each FilterGroup defines filters to apply to events based on the event type\
          \ and optionally the resource id of the messages.\nIf omitted, all events\
          \ will be received.\n\nIf using a reconnect_token to reconnect, then this\
          \ field should be omitted unless\ntrying to change the filters from previous\
          \ values.\n\n**NOTE**: If you are using this request to change which\n \
          \     filters are being used, you must also include the previous filter\
          \ groups in\n      the \"previous_filter_groups\" field.\n\n**Example 1:\
          \ Basic filter with a single resource filter**\n```json\n[\n  {\n    \"\
          event_type\": \"my.event.type\",\n    \"filters\": [\n      {\n        \"\
          filter_type\": \"starts_with_greedy\",\n        \"resource_id\": \"folder/\"\
          \n      }\n    ]\n  }\n]\n```\n\n**Example 2: Filter with multiple resource\
          \ filters (OR logic)**\n```json\n[\n  {\n    \"event_type\": \"my.event.type\"\
          ,\n    \"filters\": [\n      {\n        \"filter_type\": \"starts_with_lazy\"\
          ,\n        \"resource_id\": \"folder1/\"\n      },\n      {\n        \"\
          filter_type\": \"eq\",\n        \"resource_id\": \"specific/path\"\n   \
          \   }\n    ]\n  }\n]\n```\n\n**Example 3: Multiple event types with different\
          \ filters**\n```json\n[\n  {\n    \"event_type\": \"storage.created\",\n\
          \    \"filters\": [\n      {\n        \"filter_type\": \"starts_with_greedy\"\
          ,\n        \"resource_id\": \"uploads/\"\n      }\n    ]\n  },\n  {\n  \
          \  \"event_type\": \"storage.deleted\",\n    \"filters\": [\n      {\n \
          \       \"filter_type\": \"starts_with_lazy\",\n        \"resource_id\"\
          : \"temp/\"\n      }\n    ]\n  }\n]\n```\n\nSee the **FilterGroup**, **ResourceFilter**,\
          \ and **FilterType** schemas in the Components section below for the complete\
          \ structure and field descriptions."
      - name: previous_filter_groups
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 65536
          - type: 'null'
          description: 'Optional. Similar to filter_groups, a URL-encoded JSON string
            containing an array of FilterGroup objects.


            If this request is being used to update which filters are being used,

            in addition to specifying the new filter groups with the

            "filter_groups" field, this field must be included and should contain

            the previous filter groups.


            See the **FilterGroup**, **ResourceFilter**, and **FilterType** schemas
            in the Components section below for the complete structure and field descriptions.'
          title: Previous Filter Groups
        description: 'Optional. Similar to filter_groups, a URL-encoded JSON string
          containing an array of FilterGroup objects.


          If this request is being used to update which filters are being used,

          in addition to specifying the new filter groups with the

          "filter_groups" field, this field must be included and should contain

          the previous filter groups.


          See the **FilterGroup**, **ResourceFilter**, and **FilterType** schemas
          in the Components section below for the complete structure and field descriptions.'
      - name: last-event-id
        in: header
        required: false
        schema:
          type: string
          maxLength: 200
          pattern: ^[\x21-\x7e]{1,200}$
          description: 'Reconnect token for resuming the same non-durable queue after
            a disconnect. Browsers send it automatically from the SSE event id during
            automatic reconnection, in which case the connection resumes with the
            filters it already had.


            To update the filters at the same time, send both `filter_groups` and
            `previous_filter_groups` alongside this header. Sending `previous_filter_groups`
            is what makes a request a filter update; without it, any `filter_groups`
            on the request are ignored and the stream resumes as-is.'
          title: Last-Event-Id
        description: 'Reconnect token for resuming the same non-durable queue after
          a disconnect. Browsers send it automatically from the SSE event id during
          automatic reconnection, in which case the connection resumes with the filters
          it already had.


          To update the filters at the same time, send both `filter_groups` and `previous_filter_groups`
          alongside this header. Sending `previous_filter_groups` is what makes a
          request a filter update; without it, any `filter_groups` on the request
          are ignored and the stream resumes as-is.'
      responses:
        '200':
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                properties:
                  event:
                    default: event
                    maxLength: 256
                    title: Event
                    type: string
                  data:
                    description: Model representing a full event payload.
                    properties:
                      event_type:
                        description: Type of event - defined by the publisher
                        maxLength: 1024
                        title: Event Type
                        type: string
                      principal_identity:
                        default: ''
                        description: Principal who published event
                        maxLength: 1024
                        title: Principal Identity
                        type: string
                      occurred_at:
                        description: Time at which event was generated
                        format: date-time
                        maxLength: 64
                        title: Occurred At
                        type: string
                      published_at:
                        description: Time at which event was published
                        format: date-time
                        maxLength: 64
                        title: Published At
                        type: string
                      message:
                        additionalProperties: true
                        description: Body of event
                        title: Message
                        type: object
                    required:
                    - event_type
                    - occurred_at
                    - published_at
                    - message
                    title: EventData
                    type: object
                required:
                - data
                title: ConsumeEvent
                type: object
        '400':
          description: Invalid filter_groups parameter
        '422':
          description: Invalid reconnect_token (failed pattern validation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Unauthorized - The request requires valid authentication credentials.
            This typically indicates a missing, invalid, or expired authentication
            token.
          content:
            application/json:
              schema:
                description: Standard error response model for API governance.
                properties:
                  detail:
                    description: Error details
                    maxLength: 1024
                    title: Detail
                    type: string
                required:
                - detail
                title: ErrorResponse
                type: object
        '403':
          description: Forbidden - The authenticated user does not have permission
            to access this resource or perform this operation.
          content:
            application/json:
              schema:
                description: Standard error response model for API governance.
                properties:
                  detail:
                    description: Error details
                    maxLength: 1024
                    title: Detail
                    type: string
                required:
                - detail
                title: ErrorResponse
                type: object
        '500':
          description: Server error
          content:
            application/json:
              schema:
                description: Standard error response model for API governance.
                properties:
                  detail:
                    description: Error details
                    maxLength: 1024
                    title: Detail
                    type: string
                required:
                - detail
                title: ErrorResponse
                type: object
        '429':
          description: Too Many Requests - Rate limit exceeded
          content:
            application/json:
              schema:
                description: Standard error response model for API governance.
                properties:
                  detail:
                    description: Error details
                    maxLength: 1024
                    title: Detail
                    type: string
                required:
                - detail
                title: ErrorResponse
                type: object
        '503':
          description: Service Unavailable - The server's channel pool is exhausted.
            This is a temporary condition. Clients should retry the request with exponential
            backoff until the error no longer occurs.
  /api/v1beta/events/stream-durable:
    get:
      summary: Stream Durable Events
      description: 'Starts a streaming session to receive events using a durable queue.
        This means any events that occurred since the queue was created with a call
        to the CreateDurableQueue endpoint will be received, even if the events occur
        while the client is disconnected.


        **Message Acknowledgment:**

        Messages delivered over this SSE stream are acknowledged to the broker automatically
        by the server after a short delay. Clients do not need to (and cannot) acknowledge
        individual messages.


        There is no negative acknowledgment (nack) here either, so a message this
        stream delivers cannot be returned to the queue for redelivery.


        If your application requires explicit client-side acknowledgment of each message
        (e.g. to guarantee at-least-once processing), or needs to negatively acknowledge
        a message it failed to process so the broker redelivers it, use the gRPC `ConsumeDurableEventsWithAcks`
        RPC instead. Its request carries both `ack_delivery_tags` and `nack_delivery_tags`.
        That RPC uses a bidirectional stream, which keeps the acknowledgment on the
        same connection and works correctly across multi-pod deployments - a delivery
        tag is scoped to the broker channel that issued it, so a separate REST call
        could not settle it reliably.


        **Queue Lifetime:**

        A durable queue that has gone without an attached consumer for the broker''s
        configured idle window (24 hours by default; operator-tunable) is deleted
        by the broker along with any messages it still holds, and this endpoint then
        returns 404. Only an attached consumer keeps a queue alive - publishing to
        it and re-declaring it do not. A client recovers by calling the CreateDurableQueue
        endpoint again with the SAME queue_id and the SAME filter groups (the bindings
        are rebuilt from the filters), so it must persist both.


        **Note on Authorization During Streaming:**

        Authorization errors (401 or 403) can occur at any time during the streaming
        session, not just at the initial connection. For example, if an authentication
        token expires while the stream is active, the server will terminate the connection
        with an authorization error. Clients must handle this by reconnecting to the
        same queue with refreshed credentials. For non-durable queues, use the reconnect_token
        or Last-Event-ID to reconnect to the same queue. For durable queues, simply
        reconnect using the same queue_id.'
      operationId: stream_durable_events_api_v1beta_events_stream_durable_get
      security:
      - HTTPBearer: []
      parameters:
      - name: queue_id
        in: query
        required: true
        schema:
          type: string
          maxLength: 200
          pattern: ^[A-Za-z0-9._-]{1,200}$
          description: 'The queue_id which was created with a call to CreateDurableQueue,
            and identifies the queue used for consuming durable events. It must match
            the shared character and length constraints (1-200 characters, each one
            of A-Z, a-z, 0-9, ''.'', ''_'', or ''-'').


            queue_ids share one deployment-wide namespace, so this must be the id
            of a queue that was created by (or for) your client; see the queue_id
            field of `POST /queues/durable`.'
          title: Queue Id
        description: 'The queue_id which was created with a call to CreateDurableQueue,
          and identifies the queue used for consuming durable events. It must match
          the shared character and length constraints (1-200 characters, each one
          of A-Z, a-z, 0-9, ''.'', ''_'', or ''-'').


          queue_ids share one deployment-wide namespace, so this must be the id of
          a queue that was created by (or for) your client; see the queue_id field
          of `POST /queues/durable`.'
      responses:
        '200':
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                properties:
                  event:
                    default: event
                    maxLength: 256
                    title: Event
                    type: string
                  data:
                    description: Model representing a full event payload.
                    properties:
                      event_type:
                        description: Type of event - defined by the publisher
                        maxLength: 1024
                        title: Event Type
                        type: string
                      principal_identity:
                        default: ''
                        description: Principal who published event
                        maxLength: 1024
                        title: Principal Identity
                        type: string
                      occurred_at:
                        description: Time at which event was generated
                        format: date-time
                        maxLength: 64
                        title: Occurred At
                        type: string
                      published_at:
                        description: Time at which event was published
                        format: date-time
                        maxLength: 64
                        title: Published At
                        type: string
                      message:
                        additionalProperties: true
                        description: Body of event
                        title: Message
                        type: object
                    required:
                    - event_type
                    - occurred_at
                    - published_at
                    - message
                    title: EventData
                    type: object
                required:
                - data
                title: ConsumeEvent
                type: object
        '422':
          description: Invalid queue_id (failed pattern validation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: Queue not found - the queue_id is unknown, or the queue was
            auto-deleted by the broker after going without an attached consumer for
            the idle window. Recover by calling CreateDurableQueue again with the
            same queue_id and filter groups.
        '401':
          description: Unauthorized - The request requires valid authentication credentials.
            This typically indicates a missing, invalid, or expired authentication
            token.
          content:
            application/json:
              schema:
                description: Standard error response model for API governance.
                properties:
                  detail:
                    description: Error details
                    maxLength: 1024
                    title: Detail
                    type: string
                required:
                - detail
                title: ErrorResponse
                type: object
        '403':
          description: Forbidden - The authenticated user does not have permission
            to access this resource or perform this operation.
          content:
            application/json:
              schema:
                description: Standard error response model for API governance.
                properties:
                  detail:
                    description: Error details
                    maxLength: 1024
                    title: Detail
                    type: string
                required:
                - detail
                title: ErrorResponse
                type: object
        '500':
          description: Server error
          content:
            application/json:
              schema:
                description: Standard error response model for API governance.
                properties:
                  detail:
                    description: Error details
                    maxLength: 1024
                    title: Detail
                    type: string
                required:
                - detail
                title: ErrorResponse
                type: object
        '429':
          description: Too Many Requests - Rate limit exceeded
          content:
            application/json:
              schema:
                description: Standard error response model for API governance.
                properties:
                  detail:
                    description: Error details
                    maxLength: 1024
                    title: Detail
                    type: string
                required:
                - detail
                title: ErrorResponse
                type: object
        '503':
          description: Service Unavailable - The server's channel pool is exhausted.
            This is a temporary condition. Clients should retry the request with exponential
            backoff until the error no longer occurs.
  /api/v1beta/queues/durable:
    post:
      summary: Create Durable Queue
      description: 'Creates a durable queue which will immediately begin receiving
        and queuing up messages for later consumption. A durable queue exists until
        it is explicitly deleted with a call to the DeleteDurableQueue endpoint, or
        until it has gone without an attached consumer for the broker''s configured
        idle window (24 hours by default; operator-tunable), at which point the broker
        deletes it along with any messages it still holds. Only an attached consumer
        keeps a queue alive - publishing to it and re-declaring it do not. Consuming
        from a queue that has been reaped this way returns 404; a client recovers
        by calling this endpoint again with the same queue_id, so it must persist
        BOTH the queue_id AND the filter groups the queue was created with (the bindings
        are rebuilt from the filters). A config object will be returned that includes
        an ID that must be reused as an argument in all future ConsumeDurableEvents
        calls.


        **Queue ID Uniqueness:**

        A client-supplied queue_id must be unique across the whole deployment. Queue
        ids share a single namespace, and this endpoint is ensure-exists: if a queue
        with the supplied id already exists - regardless of who created it or which
        filter groups are passed - the call returns created=false along with that
        existing queue, still bound to its existing filters. Two callers that pick
        the same id therefore share one queue: each receives the other''s events,
        and either can delete it. Use a UUID, or a namespaced convention such as `<service-name>-<purpose>`;
        never a bare generic word like `events`.


        **Authorization:**

        Per-queue isolation is not enforced. The three durable-queue permissions are
        deployment-wide rather than per-queue: a principal granted `consume-durable-queues`
        can consume from any durable queue whose id it knows, one granted `delete-durable-queues`
        can delete any of them, and `create-durable-queues` authorizes both creating
        a queue and updating the filters of any existing one. Operators should therefore
        grant these permissions deliberately - to service accounts rather than to
        broad user groups.'
      operationId: create_durable_queue_api_v1beta_queues_durable_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDurableQueueRequest'
      responses:
        '200':
          description: Queue created (no queue_id supplied), or an existing queue
            with the supplied queue_id was returned unchanged (created=false).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDurableQueueResponse'
        '201':
          description: A new durable queue was created with the supplied queue_id
            (created=true).
        '400':
          description: Invalid request
        '422':
          description: Invalid queue_id (failed pattern validation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Unauthorized - The request requires valid authentication credentials.
            This typically indicates a missing, invalid, or expired authentication
            token.
          content:
            application/json:
              schema:
                description: Standard error response model for API governance.
                properties:
                  detail:
                    description: Error details
                    maxLength: 1024
                    title: Detail
                    type: string
                required:
                - detail
                title: ErrorResponse
                type: object
        '403':
          description: Forbidden - The authenticated user does not have permission
            to access this resource or perform this operation.
          content:
            application/json:
              schema:
                description: Standard error response model for API governance.
                properties:
                  detail:
                    description: Error details
                    maxLength: 1024
                    title: Detail
                    type: string
                required:
                - detail
                title: ErrorResponse
                type: object
        '500':
          description: Server error
          content:
            application/json:
              schema:
                description: Standard error response model for API governance.
                properties:
                  detail:
                    description: Error details
                    maxLength: 1024
                    title: Detail
                    type: string
                required:
                - detail
                title: ErrorResponse
                type: object
        '429':
          description: Too Many Requests - Rate limit exceeded
          content:
            application/json:
              schema:
                description: Standard error response model for API governance.
                properties:
                  detail:
                    description: Error details
                    maxLength: 1024
                    title: Detail
                    type: string
                required:
                - detail
                title: ErrorResponse
                type: object
        '503':
          description: Service Unavailable - The server's channel pool is exhausted.
            This is a temporary condition. Clients should retry the request with exponential
            backoff until the error no longer occurs.
    delete:
      summary: Delete Durable Queue
      description: Deletes a durable consumer queue. This is called if a durable consumer
        queue was created and used, and it is no longer required. This typically only
        happens if the consumer client is being taken down permanently.
      operationId: delete_durable_queue_api_v1beta_queues_durable_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: queue_id
        in: query
        required: true
        schema:
          type: string
          maxLength: 200
          pattern: ^[A-Za-z0-9._-]{1,200}$
          description: 'The queue_id identifies the durable queue to delete. It was
            created with a call to the CreateDurableQueue endpoint. It must match
            the shared character and length constraints (1-200 characters, each one
            of A-Z, a-z, 0-9, ''.'', ''_'', or ''-'').


            queue_ids share one deployment-wide namespace, so this must be the id
            of a queue that was created by (or for) your client; see the queue_id
            field of `POST /queues/durable`.'
          title: Queue Id
        description: 'The queue_id identifies the durable queue to delete. It was
          created with a call to the CreateDurableQueue endpoint. It must match the
          shared character and length constraints (1-200 characters, each one of A-Z,
          a-z, 0-9, ''.'', ''_'', or ''-'').


          queue_ids share one deployment-wide namespace, so this must be the id of
          a queue that was created by (or for) your client; see the queue_id field
          of `POST /queues/durable`.'
      responses:
        '200':
          description: Queue deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteDurableQueueResponse'
        '400':
          description: Invalid request
        '404':
          description: Queue not found
        '422':
          description: Invalid queue_id (failed pattern validation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Unauthorized - The request requires valid authentication credentials.
            This typically indicates a missing, invalid, or expired authentication
            token.
          content:
            application/json:
              schema:
                description: Standard error response model for API governance.
                properties:
                  detail:
                    description: Error details
                    maxLength: 1024
                    title: Detail
                    type: string
                required:
                - detail
                title: ErrorResponse
                type: object
        '403':
          description: Forbidden - The authenticated user does not have permission
            to access this resource or perform this operation.
          content:
            application/json:
              schema:
                description: Standard error response model for API governance.
                properties:
                  detail:
                    description: Error details
                    maxLength: 1024
                    title: Detail
                    type: string
                required:
                - detail
                title: ErrorResponse
                type: object
        '500':
          description: Server error
          content:
