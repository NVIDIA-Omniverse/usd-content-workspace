  /api/v1beta/metrics/channel-pool:
    get:
      summary: Channel Pool Metrics
      description: Returns the current channel pool utilization metrics. This endpoint
        is used by the autoscaler to make scaling decisions based on the channel pool
        capacity.
      operationId: channel_pool_metrics_api_v1beta_metrics_channel_pool_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelPoolMetricsResponse'
components:
  schemas:
    ChannelPoolMetricsResponse:
      properties:
        utilization_percent:
          type: integer
          maximum: 100.0
          minimum: 0.0
          format: int32
          title: Utilization Percent
          description: Percentage of effective non-durable stream capacity in use
            (0-100).
        channels_in_use:
          type: integer
          maximum: 2147483647.0
          minimum: 0.0
          format: int32
          title: Channels In Use
          description: Active streams on the non-durable pool, in stream slots. This
            may exceed channels_total while the pod is serving in the overflow band;
            it is deliberately left effectively unclamped (the maximum is a non-binding
            int32 sentinel) so the autoscaler sees the true load and the resulting
            negative available capacity.
        channels_total:
          type: integer
          maximum: 2147483647.0
          minimum: 0.0
          format: int32
          title: Channels Total
          description: 'Effective non-durable stream capacity: that pool''s stream
            capacity less the readiness reserve, in stream slots. The autoscaler uses
            this to determine usable available capacity.'
      type: object
      required:
      - utilization_percent
      - channels_in_use
      - channels_total
      title: ChannelPoolMetricsResponse
      description: 'Response model for the channel pool metrics endpoint.


        Values are counted in non-durable stream slots, not channels.'
      examples:
      - channels_in_use: 75
        channels_total: 100
        utilization_percent: 75
    CreateDurableQueueRequest:
      properties:
        filter_groups:
          items:
            $ref: '#/components/schemas/FilterGroup'
          type: array
          maxItems: 100
          title: Filter Groups
          description: Filter groups that define the sets of filters to apply to events
            based on the resource id of the messages. If omitted or empty, all events
            for an event type are added to the queue for later consumption.
        queue_id:
          anyOf:
          - type: string
            maxLength: 200
            pattern: ^[A-Za-z0-9._-]{1,200}$
          - type: 'null'
          title: Queue Id
          description: 'Optional client-specified id for the durable queue. If supplied,
            it must match the shared character and length constraints (1-200 characters,
            each one of A-Z, a-z, 0-9, ''.'', ''_'', or ''-''). If omitted, the service
            generates a queue_id.


            A supplied queue_id must be unique across the whole deployment. Queue
            ids share a single namespace: this endpoint attaches to an existing queue
            with the supplied id regardless of who created it or which filter_groups
            are passed, returning created=false and that queue with its existing filters.
            Two callers that pick the same id therefore share one queue - each receives
            the other''s events, and either can delete it. Use a UUID, or a namespaced
            convention such as <service-name>-<purpose>; never a bare generic word
            like ''events''.


            Per-queue isolation is not enforced. The three durable-queue permissions
            are deployment-wide rather than per-queue: a principal granted ''consume-durable-queues''
            can consume from any durable queue whose id it knows, one granted ''delete-durable-queues''
            can delete any of them, and ''create-durable-queues'' authorizes both
            creating a queue and updating the filters of any existing one. Operators
            should grant these permissions deliberately - to service accounts rather
            than to broad user groups.'
      type: object
      title: CreateDurableQueueRequest
      description: Request model for creating a durable queue.
    CreateDurableQueueResponse:
      properties:
        queue_id:
          type: string
          maxLength: 256
          title: Queue Id
          description: The queue_id identifies the durable queue. This ID must be
            persisted somewhere and sent on all ConsumeDurableEvents calls.
        created:
          type: boolean
          title: Created
          description: Indicates whether the durable queue was newly created (true)
            versus already existed (false).
      type: object
      required:
      - queue_id
      - created
      title: CreateDurableQueueResponse
      description: Response model for creating a durable queue.
    DeleteDurableQueueResponse:
      properties:
        success:
          type: boolean
          title: Success
          description: Indicates whether the queue was successfully deleted
          default: true
      type: object
      title: DeleteDurableQueueResponse
      description: Response model for deleting a durable queue.
    FilterGroup:
      properties:
        event_type:
          description: Event type for this filter. Other services that publish events
            will define unique event types.
          maxLength: 1024
          minLength: 1
          title: Event Type
          type: string
        filters:
          description: 'Optional: the filters for filtering on resource id (filters
            use OR logic). If no resource filters are supplied then messages will
            only be filtered by event_type.'
          items:
            $ref: '#/components/schemas/ResourceFilter'
          maxItems: 100
          title: Filters
          type: array
      required:
      - event_type
      - filters
      title: FilterGroup
      type: object
    FilterType:
      type: string
      enum:
      - unspecified
      - eq
      - starts_with_lazy
      - starts_with_greedy
      title: FilterType
      description: "FilterType specifies the matching strategy for the resource filter.\n\
        \n- unspecified: The default, unspecified filter type. This will\n  default\
        \ to eq behavior.\n- eq: Performs an exact match on the resource_id.\n- starts_with_lazy:\
        \ Performs a \"starts with\" match (lazy).\n  For example, a filter for \"\
        folder_1\" would match\n  \"folder_1/file.txt\" but not \"folder_10/file.txt\"\
        .\n- starts_with_greedy: Performs a \"starts with\" match (greedy).\n  For\
        \ example, a filter for \"folder_1\" would match\n  \"folder_1/sub/file.txt\"\
        ."
    HealthResponse:
      properties:
        status:
          type: string
          maxLength: 10
          title: Status
          default: healthy
      type: object
      title: HealthResponse
      description: Health check response.
    ResourceFilter:
      description: 'Filters events based on their resource id as defined by the

        publishing service.'
      properties:
        filter_type:
          $ref: '#/components/schemas/FilterType'
          description: 'Specifies the type of filter to apply. How much of the resource_id
            needs to match the resource in the message for the filter to be successful.


            - unspecified: The default, unspecified filter type. This will default
            to eq behavior.

            - eq: Performs an exact match on the resource_id.

            - starts_with_lazy: Performs a "starts with" match (lazy). For example,
            a filter for "folder_1" would match "folder_1/file.txt" but not "folder_10/file.txt".

            - starts_with_greedy: Performs a "starts with" match (greedy). For example,
            a filter for "folder_1" would match "folder_1/sub/file.txt".'
        resource_id:
          description: 'The path to filter the field by.</br></br>A resource is a
            path like string with words separated by slashes. For example, if two
            messages were published for the following resources:</br><b>folder_1/folder_2/folder_3/astronaut.usd</b>
            and <b>folder_1/astronaut.usd</b>, then</br>1) A filter with a resource_id
            of <b>folder_1</b> and <b>filter_type = starts_with_greedy</b> would match
            both messages.</br>2) A filter with a resource_id of <b>folder_1</b> and
            a <b>filter_type = starts_with_lazy</b> would only match the second message.</br></br>If
            <b>resource_id = ""</b>, then there are three possibilities depending
            on the value of filter_type:</br>1) starts_with_greedy: consume all messages
            of the event_type with or without a resource_id, regardless of what the
            value for resource_id in the message is; </br>2) starts_with_lazy: consume
            any message that doesn''t have a resource_id or has a resource_id="",
            AND any message with a resource_id like ''something'' or ''something/'',
            but not ''something/something-else''; </br>3) eq: generates an error response.'
          maxLength: 4096
          title: Resource Id
          type: string
      required:
      - filter_type
      - resource_id
      title: ResourceFilter
      type: object
    UpdateDurableQueueRequest:
      properties:
        queue_id:
          type: string
          maxLength: 200
          pattern: ^[A-Za-z0-9._-]{1,200}$
          title: Queue Id
          description: 'The id of the durable queue to update. It must match the shared
            character and length constraints (1-200 characters, each one of A-Z, a-z,
            0-9, ''.'', ''_'', or ''-'').


            queue_ids share one deployment-wide namespace, so this must be the id
            of a queue that was created by (or for) your client; see the queue_id
            field of POST /queues/durable.'
        current_filter_groups:
          items:
            $ref: '#/components/schemas/FilterGroup'
          type: array
          maxItems: 100
          title: Current Filter Groups
          description: The current filters in use on the existing durable queue. These
            will be replaced if new_filter_groups is provided.
        new_filter_groups:
          items:
            $ref: '#/components/schemas/FilterGroup'
          type: array
          maxItems: 100
          title: New Filter Groups
          description: The new filters to use on the existing durable queue. They
            will replace the existing filters.
      type: object
      required:
      - queue_id
      - current_filter_groups
      - new_filter_groups
      title: UpdateDurableQueueRequest
      description: Request model for updating a durable queue's filters.
    UpdateDurableQueueResponse:
      properties:
        success:
          type: boolean
          title: Success
          description: Indicates whether the queue was successfully updated
          default: true
      type: object
      title: UpdateDurableQueueResponse
      description: Response model for updating a durable queue.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
              maxLength: 256
            - type: integer
              format: int32
              minimum: 0
              maximum: 2147483647
          type: array
          maxItems: 100
          title: Location
        msg:
          type: string
          maxLength: 1024
          title: Message
        type:
          type: string
          maxLength: 256
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          maxItems: 100
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication using JWT. Implements security best
        practices from RFC8725.
