[project]
name = "event-aggregation-conformance-tests"
version = "0.0.0"
description = "Blackbox conformance tests for the Event Aggregation Service (gRPC + REST)"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.75.0",
    "protobuf>=5.0.0",
    "googleapis-common-protos",
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[project.scripts]
run-conformance-tests = "conformance_tests:run_tests"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conformance_tests", "src/nvidia"]

# Conformance tests are shipped to external customers, so dependencies
# must resolve from public PyPI. Declaring PyPI explicitly as the
# default index keeps resolution there whatever default index the
# surrounding environment configures.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["src/conformance_tests"]
markers = [
    "grpc: gRPC API tests",
    "rest: REST API tests",
    "optional: tests that are informational and may be skipped",
]
addopts = "--strict-markers"
