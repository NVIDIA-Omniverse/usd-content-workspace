#
# docker-compose for running conformance tests locally against the service.
#
# Quick start:
#   # Build the conformance tests image first (from this directory):
#   docker build -t event-aggregation-conformance-tests:local .
#
#   # Set the service image and run:
#   SERVICE_IMAGE=nvcr.io/nvidia/omniverse/event-aggregation-service:1.0.0 \
#     docker compose run --rm conformance-tests
#
# Environment variables:
#   SERVICE_IMAGE             - event-aggregation-service image to test against (required)
#   CONFORMANCE_IMAGE         - conformance tests image (default: event-aggregation-conformance-tests:local)
#   CONFORMANCE_AUTH_TOKEN    - Bearer token (if the service has auth enabled)
#   CONFORMANCE_AUTH_REQUIRED - set to "true" to run auth-error tests

services:
  rabbitmq:
    image: rabbitmq:4.1.3
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - conformance-net

  event-aggregation-service:
    image: "${SERVICE_IMAGE:-nvcr.io/nvidia/omniverse/event-aggregation-service:latest}"
    ports:
      - "50051:50051"
      - "8001:8001"
    environment:
      OMNI_EVENTS_RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672
      OMNI_EVENTS_REST_API_ENABLED: "true"
      OMNI_EVENTS_OPENID_ENABLED: "false"
      OMNI_EVENTS_PRINCIPAL_SOURCE: "disabled"
      OMNI_EVENTS_PERMISSIONS_ENDPOINT: ""
      # The image's REST server binds 8000 by default; the port mapping above and
      # CONFORMANCE_REST_ENDPOINT below use 8001.
      OMNI_EVENTS_REST_PORT: "8001"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - conformance-net

  conformance-tests:
    image: "${CONFORMANCE_IMAGE:-event-aggregation-conformance-tests:local}"
    environment:
      CONFORMANCE_GRPC_ENDPOINT: event-aggregation-service:50051
      CONFORMANCE_REST_ENDPOINT: http://event-aggregation-service:8001
      CONFORMANCE_HEALTH_ENDPOINT: http://event-aggregation-service:8001/api/v1beta/health
      CONFORMANCE_AUTH_TOKEN: "${CONFORMANCE_AUTH_TOKEN:-}"
      CONFORMANCE_AUTH_REQUIRED: "${CONFORMANCE_AUTH_REQUIRED:-false}"
    depends_on:
      - event-aggregation-service
    networks:
      - conformance-net
    volumes:
      - ./reports:/app/reports

networks:
  conformance-net:
    driver: bridge
