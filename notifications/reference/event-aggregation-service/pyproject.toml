[project]
name = "event-aggregation-service"
version = "1.7.0"
description = ""
authors = [{ name = "NVIDIA" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"

dependencies = [
    "notification-common==7.0.2",
    "grpcio>=1.80.0,<2",
    # Pin the codegen tool (NOT the runtime) to 1.76.0 so regenerated stubs stamp
    # GRPC_GENERATED_VERSION='1.76.0', matching the grpcio shipped in the
    # smoke-test-base image. A newer grpcio-tools stamps a floor above the smoke
    # image's grpcio and breaks the post-upgrade smoke tests at import. The CVE
    # (CVE-2026-33186) is in grpcio the runtime, which stays >=1.80. Mirrors the
    # same pin in ../event_consumer_service (its commit a4522a6).
    "grpcio-tools==1.76.0",
    "cryptography>=50.0.1",
    "pygments>=2.20.0",
]

[tool.app]
api_version = "v1beta"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "pytest-random-order>=1.1.1",
    "black>=25.1.0",
    "flake8>=7.1.1",
    "pytest-cov>=6.0.0",
    "pytest-freezer>=0.4.9,<0.5",
    "pyyaml>=6.0.2,<7",
    "pip-licenses>=5.0.0,<6",
    "pre-commit>=4.0.1,<5",
    "mypy-protobuf>=5.1,<6",
]

[project.scripts]
start = "public_scripts.app_scripts:start"
lint = "notification_common.scripts.app_scripts:lint"
test = "notification_common.scripts.app_scripts:test"
generate_openapi_yaml = "notification_common.scripts.app_scripts:generate_openapi_yaml"
generate_attributions = "notification_common.scripts.generate_attributions:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `public_scripts` holds the modules that must ship OUTSIDE the internal-only
# `scripts/` tree -- today the `start` entry point, which the published source
# has to carry.
packages = ["app", "public_scripts"]

[tool.uv]
default-groups = ["dev"]
# notification-common declares grpcio-tools>=1.78.0 to match the grpcio floor its
# generated stubs stamp, but grpcio-tools is a codegen-only build tool that
# notification-common never imports at runtime. This service deliberately pins the
# codegen tool at 1.76.0 (see the dependencies comment above) so regenerated stubs
# stay smoke-test compatible. Override the transitive floor to keep that pin; the
# runtime grpcio stays >=1.80.0, so the discovery stubs' import-time version check
# is still satisfied.
override-dependencies = ["grpcio-tools==1.76.0"]

[tool.uv.sources]
notification-common = { path = "../common" }

[tool.black]
target-version = ["py314"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.tools
  | \.idea
  | _deps
  | _build
  | buck-out
  | build
  | dist
  | \.migrations
  | nvidia
  | proto
  | notification_protos
  | blib2to3
  | tests/data
)/
|
scripts/demo\.py$
|
\.flake8$
|
pytest_report/pytest_report\.xml$
'''
