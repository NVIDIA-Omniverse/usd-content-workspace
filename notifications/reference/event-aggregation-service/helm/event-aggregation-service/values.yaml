## Smoke test base image configuration
## Used for running helm test without building a custom test image.
## The smoke tests themselves are configured, and their auth and permission
## needs described, in the `tests` block below.
smokeTest:
  image:
    ## @param smokeTest.image.repository Smoke test base image repository
    repository: nvcr.io/nvidia/omniverse/smoke-test-base
    ## @param smokeTest.image.tag Smoke test base image tag
    tag: "1.0.1"
    ## @param smokeTest.image.pullPolicy Image pull policy. Allowed values: Always, IfNotPresent, Never
    pullPolicy: IfNotPresent
    ## @param smokeTest.image.pullSecrets Pull secrets for the smoke test image
    pullSecrets: []
    #  - name: secret
  ## @param smokeTest.podLabels Labels applied to the smoke-test pod only (not the main Deployment).
  ## Required for workload-identity: the Azure mutating webhook injects the
  ## projected token volume/env only into pods carrying
  ## `azure.workload.identity/use: "true"`. Falls back to `.Values.podLabels`
  ## when unset.
  podLabels: {}
  # Example:
  # podLabels:
  #   azure.workload.identity/use: "true"
## Test suite configuration (smoke tests)
## Deploys a test pod that runs smoke tests against the Event Aggregation Service
## (publish single/batch events via REST and gRPC).
##
## Summary:
## - Enable: tests.enabled: true (then helm install/upgrade or helm test <release>).
## - Auth: When the service requires a token (principalSource is not "disabled"),
##   give the test pod a Bearer token in one of two ways, never both: tests.auth
##   (OAuth client credentials) or the token-file flow, which
##   tests.serviceIdentity.accessTokenFile.enabled turns on and which needs
##   tests.serviceIdentity.accessTokenFile.provisionerSidecar.container (the
##   sidecar that writes the token file).
## - Permissions: When permissions.enabled is true, the permissions service must
##   allow the test principal to perform "publish-event" on EventType
##   "omni.storage.created" (single-event publish) and "test.batch.publish"
##   (batch publish). For example, as Cedar-style policies, one per event type:
##     permit(
##       principal == Principal::"principal-id-goes-here",
##       action == Action::"event-aggregation-service:publish-event",
##       resource == EventType::"omni.storage.created"
##     );
##     permit(
##       principal == Principal::"principal-id-goes-here",
##       action == Action::"event-aggregation-service:publish-event",
##       resource == EventType::"test.batch.publish"
##     );
tests:
  ## @param tests.enabled Enable/disable test suite.
  ## Default: false. Type: boolean. Optional.
  ## Example: enabled: true (to run tests on helm install/upgrade)
  enabled: false
  ## Dedicated ServiceAccount for the smoke-test Job. Separate from the
  ## main service SA so the test runs under its own AAD identity — the
  ## smoke-test is a client of event-aggregation-service, not the service
  ## itself.
  serviceAccount:
    ## Whether to create the SA. Set to false to bind to a pre-existing SA
    ## via `name` below.
    create: true
    ## Override the generated SA name. Defaults to `<fullname>-test-smoke`.
    name: ""
    ## Annotations on the SA (e.g. `azure.workload.identity/client-id`).
    annotations: {}
    ## Automatically mount the SA's API credentials.
    automount: true
  ## Workload-identity for the smoke-test pod. Independent from the main
  ## service's identity — the smoke-test has its own SA (above) and its
  ## own sidecar toggle here.
  serviceIdentity:
    accessTokenFile:
      ## @param tests.serviceIdentity.accessTokenFile.enabled Enable the access-token-file flow for smoke-test.
      enabled: false
      provisionerSidecar:
        ## Container spec for the token-provisioner sidecar. Rendered as a
        ## K8s 1.29+ native sidecar (an initContainer with
        ## `restartPolicy: Always`). The chart adds a `token-exchange`
        ## volumeMount; `name` and `restartPolicy` are controlled by the
        ## chart and any values supplied here for those keys are ignored.
        ##
        ## CONTRACT: the sidecar MUST write the token to
        ## `/etc/secrets/access-token/token` — that path is hardcoded in
        ## the test container's read side (SMOKE_TESTS_ACCESS_TOKEN_FILE_PATH).
        ## Set the sidecar's `TOKEN_OUTPUT_PATH` env to exactly that path;
        ## a mismatch makes the test wait the full 30s and then fail.
        container: {}
        # Example:
        # container:
        #   image: nvcr.io/.../client-credentials-sidecar:0.0.4
        #   env:
        #     - name: AZURE_TENANT_ID
        #       value: <tenant-uuid>
        #     - name: OAUTH2_CLIENT_ID
        #       value: <client-id>
        #     - name: OAUTH2_SCOPE
        #       value: <resource-app-id>/.default
        #     - name: AUTH_MODE
        #       value: workload-identity
        #     - name: TOKEN_OUTPUT_PATH
        #       value: /etc/secrets/access-token/token
  ## @param tests.runGrpcTests Enable or disable gRPC tests.
  ## Default: true. Type: boolean. Optional.
  runGrpcTests: true
  ## @param tests.runRestTests Enable or disable REST tests.
  ## Default: true. Type: boolean. Optional.
  runRestTests: true
  ## @param tests.ttlSecondsAfterFinished Seconds after the smoke test Job completes
  ## (Succeeded or Failed) before it is cleaned up. 0 = do not delete automatically.
  ## Default: 900 (15 minutes). Type: integer.
  ttlSecondsAfterFinished: 900
  ## @param tests.timeout Request timeout in seconds.
  ## Default: "". Type: string. Optional.
  ## Example: "30"
  timeout: ""
  ## @param tests.grpcSkipTls Skip TLS verification for gRPC connections.
  ## Default: "". Type: string. Optional.
  ## Example: "true"
  grpcSkipTls: ""
  ## @param tests.restSkipTls Skip TLS verification for REST (requests) connections.
  ## Default: "". Type: string. Optional.
  ## Example: "true"
  restSkipTls: ""
  ## Event Aggregation Service endpoints (optional override).
  ## If set — always used. If not set — default: when httpProxy.enabled use ingress URLs
  ## (gRPC: https://grpc.<fqdn>, REST: https://<fqdn><path>; or http when TLS off);
  ## when ingress off use in-cluster: http://<service>.<namespace>.svc.cluster.local:<port>.
  ## @param tests.grpcAggregationEndpoint gRPC endpoint override.
  ## Example: "https://grpc.event-aggregation.example.com"
  grpcAggregationEndpoint: ""
  ## @param tests.restAggregationEndpoint REST endpoint override.
  ## Example: "https://event-aggregation.example.com"
  restAggregationEndpoint: ""
  ## Token authentication for smoke tests (optional).
  ## Required when the service requires a token (principalSource is not "disabled")
  ## and the token-file flow (tests.serviceIdentity.accessTokenFile.enabled) is
  ## not used.
  ## The tests use OAuth 2.0 client credentials to obtain a Bearer token and send
  ## it on REST and gRPC requests. Each property accepts the standard Kubernetes
  ## EnvVar schema: "value" (inline) or "valueFrom" (secret/configMap).
  ## See: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.35/#envvar-v1-core
  ##
  ## Obtaining credentials (e.g. Microsoft Entra / Azure AD):
  ## 1. Create an app registration; create a client secret under Certificates & secrets.
  ## 2. Grant the app the required API permission (and admin consent if needed).
  ## 3. microsoftUrl: OpenID discovery URL, e.g.
  ##    https://login.microsoftonline.com/<tenant-id>/v2.0/.well-known/openid-configuration
  ## 4. credentials: string "client_id:client_secret" (no spaces). Prefer valueFrom
  ##    secretKeyRef to avoid storing secrets in values.
  ## 5. scope: e.g. "<client-id>/.default" or your API scope.
  ##
  ## Permissions: If permissions.enabled is true, the principal identified by this
  ## token must have "publish-event" permission on EventType "omni.storage.created"
  ## and "test.batch.publish". The `tests` block summary above has a policy example.
  auth:
    ## OIDC discovery URL (returns JSON with token_endpoint). Used to get access token.
    microsoftUrl: {}
    # value: "https://login.microsoftonline.com/<tenant-id>/v2.0/.well-known/openid-configuration"
    # -- OR --
    # valueFrom:
    #   secretKeyRef:
    #     name: "my-secret"
    #     key: "microsoft-url"

    ## Client credentials in the form client_id:client_secret. Prefer valueFrom.
    credentials: {}
    # value: "client_id:client_secret"
    # -- OR --
    # valueFrom:
    #   secretKeyRef:
    #     name: "my-secret"
    #     key: "credentials"

    ## OAuth scope requested when obtaining the token (e.g. "<client-id>/.default").
    scope: {}
    # value: "<client-id>/.default"
    # -- OR --
    # valueFrom:
    #   secretKeyRef:
    #     name: "my-secret"
    #     key: "scope"
