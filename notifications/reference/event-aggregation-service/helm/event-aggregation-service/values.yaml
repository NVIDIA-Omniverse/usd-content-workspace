  ## Optional.
  targetCPUUtilizationPercentage: 70
  # @param autoscaling.targetMemoryUtilizationPercentage Target memory utilization percentage for autoscaling. Type: integer. Optional.
  # targetMemoryUtilizationPercentage: 70
