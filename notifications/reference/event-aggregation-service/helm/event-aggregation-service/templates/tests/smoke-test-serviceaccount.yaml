{{- if and .Values.tests.enabled .Values.tests.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "event-aggregation-service.smokeTestServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "event-aggregation-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test,post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.tests.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.tests.serviceAccount.automount }}
{{- end }}
