apiVersion: v1
kind: Service
metadata:
  name: {{ include "event-aggregation-service.servicename" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "event-aggregation-service.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    {{- if .Values.rest.enabled }}
    - port: {{ .Values.rest.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- end }}
  selector:
    {{- include "event-aggregation-service.selectorLabels" . | nindent 4 }}
