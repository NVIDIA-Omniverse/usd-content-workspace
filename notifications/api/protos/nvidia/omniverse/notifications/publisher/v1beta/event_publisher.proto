syntax = "proto3";

package nvidia.omniverse.notifications.publisher.v1beta;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/nvidia/omniverse/notifications/publisher/v1beta";
option java_multiple_files = true;
option java_outer_classname = "EventPublisherProto";
option java_package = "com.nvidia.omniverse.notifications.publisher.v1beta";

// The service used for publishing events
service EventPublishingService {
  // A simple RPC for publishing an arbitrary event.
  //
  // A publish that the broker rejects or that fails inside the service is
  // reported in the response, not as an RPC error: the returned
  // PublishingResult carries success = false and a failure_reason. The RPC
  // itself completes with OK in that case, so clients must inspect the result
  // rather than rely on the status code alone.
  //
  // A request that breaks one of the limits documented on Event and
  // EventResource is refused before anything is published: the RPC fails
  // with INVALID_ARGUMENT, and the error message names the field (for example
  // "event.message").
  //
  // The request is also bounded by the server's gRPC inbound message size,
  // 4 MiB by default. A larger request is refused by the transport with
  // RESOURCE_EXHAUSTED before it is processed, and the error names no field.
  rpc PublishEvent(PublishEventRequest) returns (PublishEventResponse) {}

  // A simple RPC for publishing one or more arbitrary events in parallel.
  //
  // Per-event publish failures are reported in the response, not as an RPC
  // error: each PublishingResult in the batch carries its own success flag and
  // failure_reason, and the RPC itself completes with OK even when some or all
  // events failed to publish. Clients must inspect every result.
  //
  // A batch that breaks a limit is refused as a whole before anything is
  // published: the RPC fails with INVALID_ARGUMENT. The limits are the batch
  // size on BatchPublishEventsRequest and the per-event limits on Event and
  // EventResource; for a per-event limit, the error message names the event
  // and field (for example "events[1].message").
  //
  // The request as a whole is also bounded by the server's gRPC inbound
  // message size, 4 MiB by default. A larger request is refused by the
  // transport with RESOURCE_EXHAUSTED before it is processed, and the error
  // names no field. For events averaging more than about 4 KiB, this bound is
  // reached before the 1000-event limit.
  rpc BatchPublishEvents(BatchPublishEventsRequest) returns (BatchPublishEventsResponse) {}
}

// The request object sent when publishing a single event.
message PublishEventRequest {
  // the event to publish
  Event event = 1;
}

// The request object sent when publishing events.
// When multiple events are sent they are published
// into the message broker in parallel for faster
// performance.
message BatchPublishEventsRequest {
  // the events that should be published: at least 1 and at most 1000. Any
  // other count is refused with INVALID_ARGUMENT and nothing is published.
  repeated Event events = 1;
}

// The event object that encapsulates all event data
message Event {
  // A string that defines the event type.
  // Services that use the notification aggregation service will
  // typically define their own event types, so this is
  // not an enum of known values.
  //
  // At most 256 characters (Unicode code points).
  string event_type = 1;

  // JSON event message.
  //
  // At most 65536 bytes, measured after conversion from Struct (every number
  // is a double, so 1 counts as 1.0) as JSON in Python's json.dumps default
  // form: ", " and ": " separators, and non-ASCII characters escaped as
  // \uXXXX (six bytes each; twelve, as a surrogate pair, outside the Basic
  // Multilingual Plane), plus JSON's usual escapes for quotes, backslashes,
  // and control characters. Leave headroom rather than sizing to the byte.
  google.protobuf.Struct message = 2;

  // timestamp for when the event occurred. Required: an unset value (any time
  // whose seconds field is 0, i.e. within the first second of the Unix epoch)
  // is refused with INVALID_ARGUMENT.
  google.protobuf.Timestamp occurred_at = 3;

  // Optional: used to identify a resource that the event is concerned with.
  // This can be used by consumer clients for filtering of messages, beyond
  // just filtering by event_type.
  //
  // NOTE: if the resource is omitted, then it is the equivalent of
  // passing a resource with resource_id="". Please see the event-consumer-service's
  // proto file for documentation of filtering messages that have a blank resource_id.
  EventResource resource = 4;
}

// The resource that the event is concerned with.
message EventResource {
  // A path like string (slash separated) that consumers can
  // use for filtering events. Each word that is separated by a
  // slash is something that a consumer could filter by.
  //
  // E.g., in the case of Storage API, consumers will want to filter
  // on file paths, but the resource doesn't need to be an actual "path".
  //
  // Say there are two storage events,
  // one that is for a file at a path s3://a/b/c/astronaut.usd
  // and one that is for a file at a path s3://d/other_file.usd.
  //
  // When publishing, the Storage API could publish two events,
  // and the two resource strings could be:
  //
  //    filter_key = "/a/b/c/astronaut.usd"
  //
  //    and
  //
  //    filter_key = "/d/other_file.usd"
  //
  // A consumer could then specify that they only want to consume events
  // for a specific set of resources. A consumer would use a "resource_filter"
  // in the Notification Consumer API, such as:
  //
  //    {
  //      "filter_type": "FILTER_TYPE_STARTS_WITH_LAZY",
  //      "resource_id": "/a/b/"
  //    }
  //
  // and then they would get the event for astronaut.usd,
  // but not for other_file.usd
  //
  // At most 2048 characters (Unicode code points).
  string resource_id = 1;
}

// The result from when an event publish is attempted
message PublishingResult {
  // the event that was published
  Event event = 1;

  // whether or not publishing was successful
  bool success = 2;

  // if publishing failed, failure_reason contains the reason
  string failure_reason = 3;
}

// The response when an event is successfully published
message PublishEventResponse {
  // The result from when an event publish is attempted
  PublishingResult result = 1;
}

// The response when events are successfully published
message BatchPublishEventsResponse {
  // The results from all of the publishing attempts
  // for each request/event in the batch
  repeated PublishingResult results = 1;
}
