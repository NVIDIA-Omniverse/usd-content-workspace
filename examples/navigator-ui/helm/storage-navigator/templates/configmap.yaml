apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "storage-navigator.fullname" . }}
  labels:
    {{- include "storage-navigator.labels" . | nindent 4 }}
data:
  nginx.conf: |
    http {
      include /usr/local/nginx/conf/mime.types;
      disable_symlinks off;

      server {
        listen {{ .Values.service.port }};
        server_name localhost;
        client_max_body_size 32m;
        client_body_buffer_size 128k;
        client_header_buffer_size 5120k;
        large_client_header_buffers 16 5120k;

        root /var/www/html;

        location / {
            {{- if .Values.config.csp }}
          add_header Strict-Transport-Security max-age=3600;
          add_header Content-Security-Policy "{{ .Values.config.csp }}";
            {{- end }}
          try_files $uri /index.html;
        }
      }
    }

    events {}
  # Runtime configuration for the Storage Navigator SPA.
  # Mounted at /var/www/html/config.json and fetched by the app on boot.
  config.json: |
    {
      "defaultDiscovery": {{ .Values.config.defaultDiscovery | toJson }},
      "references": {{ .Values.config.references | default list | toJson }}
    }