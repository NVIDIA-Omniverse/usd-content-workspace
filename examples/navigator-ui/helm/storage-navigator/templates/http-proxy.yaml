{{- if .Values.httpProxy.enabled -}}
---

apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: {{ include "storage-navigator.fullname" . }}
  labels:
    {{- include "storage-navigator.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.httpProxy.annotations | nindent 4 }}
spec:
  virtualhost:
    fqdn: {{ print (ternary "" (print .Values.httpProxy.fqdn.host ".") (empty .Values.httpProxy.fqdn.host)) .Values.httpProxy.fqdn.domain }}
    {{- if .Values.httpProxy.tls.enabled }}
    tls:
      secretName:  {{ include "storage-navigator.tls-secret-name" . }}
    {{- end }}
  routes:
    - conditions:
        - prefix: {{ .Values.httpProxy.path | default "/" }}
      timeoutPolicy: {{ $.Values.httpProxy.timeoutPolicy | toYaml | nindent 8 }}
      {{- if $.Values.httpProxy.responseHeadersPolicy }}
      responseHeadersPolicy: {{ $.Values.httpProxy.responseHeadersPolicy | toYaml | nindent 8 }}
      {{- end }}
      services:
        - name: {{ include "storage-navigator.servicename" . }}
          port: {{ .Values.service.port }}
{{- else -}}
### HTTPProxy (ingress) is disabled, see .Values.httpProxy.enabled 
{{- end }}
