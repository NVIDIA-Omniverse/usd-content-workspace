name: auto-discovery-service

services:
  gripmock:
    # Pinned: 3.23.0 and later (2026-10-08) ship zstd-compressed layers, which the CI
    # runner's Docker cannot unpack ("archive/tar: invalid tar header"). 3.22.1 is the
    # last gzip-only release and what `latest` resolved to before then.
    image: bavix/gripmock:3.22.1@sha256:70a866e7e54c9a0e96b44db1f9e9ffb841e7726f99a1b6cb94ceac35583e00d2
    ports:
      - "4770:4770"   # gRPC
      - "4771:4771"   # admin HTTP (stub management)
    volumes:
      - ./discovery-protos/proto:/protos:ro
      - ./tests/stubs:/stubs:ro
    command:
      - "--stub=/stubs"
      - "--imports=/protos"
      - "/protos/nvidia/omniverse/discovery/capabilities/v2beta/capabilities.proto"
      - "/protos/nvidia/omniverse/discovery/capabilities/v2beta/capabilities_service.proto"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:4771/api/health/readiness 2>&1 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
