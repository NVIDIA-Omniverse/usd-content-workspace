# Local Docker Desktop values for testing one-FQDN v1/v2 path routing.
image:
  repository: auto-discovery-service
  tag: local
  pullPolicy: Never
  pullSecrets: []

fullnameOverride: auto-discovery-service

config:
  kubeNamespace: discovery-routing-test
  reconcileInterval: 2

openId:
  enabled: true
  description: Local routing test OpenID configuration
  openIdConfigurationUri: https://identity.example.test/.well-known/openid-configuration
  clientRegistrations:
    - name: default
      clientId: local-routing-test-client
      scope: openid profile

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

httpProxy:
  enabled: true
  endpoints:
    - name: external
      fqdn: discovery.local
      port: 8081
