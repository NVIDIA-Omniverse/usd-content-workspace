apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-capabilities
  labels:
    app.kubernetes.io/name: mock-capabilities
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-capabilities
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-capabilities
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-capabilities
          image: mock-capabilities:local
          imagePullPolicy: Never
          ports:
            - name: grpc
              containerPort: 50051
          env:
            - name: PORT
              value: "50051"
          readinessProbe:
            tcpSocket:
              port: grpc
          livenessProbe:
            tcpSocket:
              port: grpc
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: mock-capabilities
  labels:
    app.kubernetes.io/name: mock-capabilities
  annotations:
    discovery.omniverse.nvidia.com/enabled: "true"
    discovery.omniverse.nvidia.com/visibility: "both"
    discovery.omniverse.nvidia.com/external-rest-endpoint: "http://mock.example/rest"
    discovery.omniverse.nvidia.com/external-grpc-endpoint: "http://mock.example/grpc"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mock-capabilities
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
