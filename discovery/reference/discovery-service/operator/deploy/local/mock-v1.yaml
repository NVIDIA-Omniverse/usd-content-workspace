apiVersion: v1
kind: ConfigMap
metadata:
  name: auto-discovery-service-v1
  labels:
    app.kubernetes.io/name: auto-discovery-service-v1
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    http {
      access_log /dev/stdout;
      error_log /dev/stderr notice;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server {
        listen 8080;
        server_name _;
        location = /api/v1/services { default_type application/json; alias /var/www/api/services.json; }
        location = /api/v1alpha/services { default_type application/json; alias /var/www/api/services.json; }
      }
    }
  services.json: |
    {
      "schema-version": 1,
      "services": [
        {
          "name": "legacy-mock",
          "rest": {
            "url": "http://legacy.example/api",
            "endpoints": []
          }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-discovery-service-v1
  labels:
    app.kubernetes.io/name: auto-discovery-service-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auto-discovery-service-v1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auto-discovery-service-v1
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.31
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/v1/services
              port: http
          livenessProbe:
            httpGet:
              path: /api/v1/services
              port: http
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: config
              mountPath: /var/www/api/services.json
              subPath: services.json
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: auto-discovery-service-v1
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: auto-discovery-service
  labels:
    app.kubernetes.io/name: auto-discovery-service-v1
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auto-discovery-service-v1
  ports:
    - name: http
      port: 8080
      targetPort: http
