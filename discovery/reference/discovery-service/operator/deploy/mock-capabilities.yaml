---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-capabilities
  labels:
    app: mock-capabilities
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-capabilities
  template:
    metadata:
      labels:
        app: mock-capabilities
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-capabilities
          # Editable placeholder: point this at wherever you push/load the image
          # built from Dockerfile.mock (e.g. a local kind/minikube load or a registry).
          image: mock-capabilities:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
          env:
            - name: PORT
              value: "50051"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mock-capabilities
  labels:
    app: mock-capabilities
  annotations:
    discovery.omniverse.nvidia.com/enabled: "true"
    discovery.omniverse.nvidia.com/visibility: "internal"
spec:
  type: ClusterIP
  selector:
    app: mock-capabilities
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
