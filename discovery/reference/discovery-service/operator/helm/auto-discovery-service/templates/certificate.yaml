{{ if and .Values.httpProxy.enabled .Values.httpProxy.tls.certManager.enabled .Values.httpProxy.tls.enabled -}}
{{- $fqdns := list -}}
{{- range .Values.httpProxy.endpoints -}}
{{- $fqdns = append $fqdns (required "httpProxy.endpoints[].fqdn is required" .fqdn) -}}
{{- end -}}
{{- if not $fqdns -}}
{{- $fqdn := required "httpProxy.fqdn.domain is required when httpProxy.endpoints is empty" .Values.httpProxy.fqdn.domain -}}
{{- with .Values.httpProxy.fqdn.host -}}
{{- $fqdn = printf "%s.%s" . $fqdn -}}
{{- end -}}
{{- $fqdns = list $fqdn -}}
{{- end -}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "discovery.fullname" . }}
spec:
  secretName: {{ include "discovery.tlsSecretName" . }}
  privateKey:
    rotationPolicy: Always
  commonName: {{ first $fqdns | quote }}
  dnsNames:
    {{- range $fqdns }}
    - {{ . | quote }}
    {{- end }}
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef: {{ toYaml .Values.httpProxy.tls.certManager.issuerRef | nindent 4 }}
{{- else -}}
### CertManager's Certificate object disabled, see .Values.httpProxy.enabled, .Values.httpProxy.tls.enabled, and .values.httpProxy.tls.certManager.enabled
{{- end }}
