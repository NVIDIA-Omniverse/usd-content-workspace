openapi: 3.0.3
info:
  title: Auto-Discovery Catalog HTTP Conformance Profile
  version: v2beta
  description: >-
    Test profile aligned with docs/service/docs/service-api.md and the current
    operator implementation. Not an independently approved API standard and
    not the target-service capabilities REST v1beta contract.
paths:
  /api/v2beta/services:
    get:
      responses:
        '200':
          description: Current catalog snapshot, including an empty catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
components:
  schemas:
    Catalog:
      type: object
      required: [schema-version, services]
      properties:
        schema-version:
          type: integer
          enum: [2]
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
    Service:
      type: object
      required: [name, capability_source]
      properties:
        name:
          type: string
        capability_source:
          type: string
          enum: [grpc]
        rest:
          $ref: '#/components/schemas/RestTransport'
        grpc:
          $ref: '#/components/schemas/GrpcTransport'
    RestTransport:
      type: object
      required: [url, endpoints]
      properties:
        url:
          type: string
        endpoints:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, versions]
            properties:
              name:
                type: string
              versions:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/VersionDetail'
    VersionDetail:
      type: object
      properties:
        path:
          type: string
        service:
          type: string
    GrpcTransport:
      type: object
      required: [url, endpoints]
      properties:
        url:
          type: string
        endpoints:
          type: array
          minItems: 1
          items:
            type: object
            required: [service]
            properties:
              service:
                type: string
