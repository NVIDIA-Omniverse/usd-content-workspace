[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "discovery-conformance"
version = "0.1.0"
description = "Read-only deployment checks for Omniverse Discovery contracts"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "openapi-core>=0.19.5,<0.20",
  "PyYAML>=6,<7",
  "grpcio>=1.84,<2",
  "protobuf>=7.35.1,<8",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
generate = ["grpcio-tools==1.84.0"]

[project.scripts]
discovery-conformance = "discovery_conformance.cli:main"

[tool.setuptools]
packages = [
  "discovery_conformance",
  "discovery_conformance.specs",
  "discovery_conformance.generated",
  "discovery_conformance.generated.nvidia",
  "discovery_conformance.generated.nvidia.omniverse",
  "discovery_conformance.generated.nvidia.omniverse.discovery",
  "discovery_conformance.generated.nvidia.omniverse.discovery.capabilities",
  "discovery_conformance.generated.nvidia.omniverse.discovery.capabilities.v2beta",
]
package-dir = {"discovery_conformance.specs" = "specs"}

[tool.setuptools.package-data]
"discovery_conformance.specs" = ["*.yaml", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
