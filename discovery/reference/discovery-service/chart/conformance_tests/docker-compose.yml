# Local development: starts a test discovery NGINX and runs conformance tests.
#
#   docker compose up --abort-on-container-exit --exit-code-from conformance-tests

services:
  discovery-service:
    build:
      context: ./nginx
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 10

  conformance-tests:
    build: .
    depends_on:
      discovery-service:
        condition: service_healthy
    environment:
      CONFORMANCE_REST_ENDPOINT: http://discovery-service:8080
      CONFORMANCE_HEALTH_ENDPOINT: http://discovery-service:8080/health
    volumes:
      - ./reports:/app/reports
