[project]
name = "discovery-conformance-tests"
version = "0.0.0"
description = "Blackbox conformance tests for the Discovery Service REST API"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[project.scripts]
run-conformance-tests = "conformance_tests:run_tests"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conformance_tests"]

[tool.pytest.ini_options]
testpaths = ["src/conformance_tests"]
markers = [
    "rest: REST API tests",
    "optional: tests that are informational and may be skipped",
]
addopts = "--strict-markers"
