# Deterministic values used by scripts/test-local-kind.sh.
image:
  repository: discovery-service-local
  tag: test
  pullPolicy: Never

discovery:
  services:
    - id: storage-service-local
      name: Local Storage Service
      type: storage
      endpoints:
        grpc:
          host: ""
          port: ""
          path: ""
          tls: false
        rest:
          host: ""
          port: ""
          path: ""
          tls: false

    - id: permission-service-local
      name: Explicit Permission Service
      type: permission
      endpoints:
        grpc:
          host: grpc.permissions.test
          port: 7443
          path: ""
          tls: true
        rest:
          host: api.permissions.test
          port: 8443
          path: v1/check
          tls: true

    - id: event-aggregation-service-local
      name: Custom Event Aggregation Service
      type: notification-aggregation
      endpoints:
        rest:
          host: events.test
          port: 8088
          path: /events
          tls: false

httpProxy:
  enabled: false

openId:
  enabled: false

smokeTest:
  enabled: true
  image:
    repository: discovery-smoke-test-local
    tag: test
    pullPolicy: Never
    pullSecrets: []
