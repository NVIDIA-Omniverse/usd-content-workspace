apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "discovery-conformance-tests.fullname" . }}
  labels:
    {{- include "discovery-conformance-tests.labels" . | nindent 4 }}
  {{- with .Values.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  {{- if not (kindIs "invalid" .Values.ttlSecondsAfterFinished) }}
  ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "discovery-conformance-tests.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: {{ .Values.restartPolicy }}
      serviceAccountName: {{ include "discovery-conformance-tests.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: conformance-tests
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: CONFORMANCE_REST_ENDPOINT
              value: {{ .Values.service.restEndpoint | quote }}
            - name: CONFORMANCE_HEALTH_ENDPOINT
              value: {{ .Values.service.healthEndpoint | quote }}
            - name: CONFORMANCE_REQUEST_TIMEOUT
              value: {{ .Values.timeouts.request | quote }}
            - name: SKIP_OPTIONAL_TESTS
              value: {{ .Values.skipOptionalTests | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
