apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "discovery-service.fullname" . }}
  labels:
    {{- include "discovery-service.labels" . | nindent 4 }}
data:
  nginx.conf: |-
    # NGINX Configuration
    http {
        server {
            listen 8080;
            {{- if .Values.httpProxy.rootRedirect.enabled }}
            location / {
                return {{ (include "discovery-service.rootRedirectConfig" .) }};
            }
            {{- end }}
            location /api/v1alpha/ {
                default_type application/json;
                alias /var/www/api/;
            }
            location /api/v1/ {
                default_type application/json;
                alias /var/www/api/;
            }
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
            location /metrics {
                stub_status on;
                access_log off;
            }
        }
    }

    events { }

  index.html: |-
    <!DOCTYPE html>
    <html lang="en_US">
    <head>
        <title>Discovery Service version {{ .Chart.AppVersion }}</title>
        <style>
            html { color-scheme: light dark; }
            body { width: 35em; margin: 0 auto;
                font-family: "Courier New", Tahoma, Verdana, Arial, sans-serif; }
        </style>
    </head>
    <body>
    <pre>Your Discovery Service is up and operating normally.</pre>
    </body>
    </html>

  servicesJson: |-
    {{ (include "discovery-service.mkServiceJson" .) | nindent 6 }}

  {{- if .Values.openId.enabled }}
  authConfigJson: |-
    {{ (include "discovery-service.mkAuthConfigJson" .) | nindent 6 }}
  {{- end }}
   
