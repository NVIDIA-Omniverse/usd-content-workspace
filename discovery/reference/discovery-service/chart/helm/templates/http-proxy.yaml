{{- if .Values.httpProxy.enabled -}}
---

apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: {{ include "discovery-service.fullname" . }}
  labels:
    {{- include "discovery-service.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.httpProxy.annotations | nindent 4 }}
spec:
  virtualhost:
    fqdn: {{ print (ternary "" (print .Values.httpProxy.fqdn.host ".") (empty .Values.httpProxy.fqdn.host)) .Values.httpProxy.fqdn.domain }}
    {{- if .Values.httpProxy.tls.enabled }}
    tls:
      secretName:  {{ include "discovery-service.tls-secret-name" . }}
    {{- end }}

    {{- if $.Values.httpProxy.authExtension.enabled }}
    authorization:
      responseTimeout: {{ $.Values.httpProxy.authExtension.responseTimeout }}
      extensionRef:
        name: {{ $.Values.httpProxy.authExtension.extensionRef.name }}
        namespace: {{ $.Values.httpProxy.authExtension.extensionRef.namespace | default $.Release.Namespace }} 
    {{- end }}
    corsPolicy: {{ .Values.httpProxy.corsPolicy | toYaml | nindent 6 }}
  routes:
    - conditions:
        - regex: {{ print (.Values.httpProxy.path | default "/") "api/v1.*/services"  }}
      timeoutPolicy: {{ $.Values.httpProxy.timeoutPolicy | toYaml | nindent 8 }}
      services:
        - name: {{ include "discovery-service.servicename" . }}
          port: {{ .Values.service.ports.http }}
    - conditions:
        - regex: {{ print (.Values.httpProxy.path | default "/") "api/v1.*/auth-config"  }}
      timeoutPolicy: {{ $.Values.httpProxy.timeoutPolicy | toYaml | nindent 8 }}
      services:
        - name: {{ include "discovery-service.servicename" . }}
          port: {{ .Values.service.ports.http }}
      authPolicy: 
        disabled: true
    - conditions:
        - prefix: "/"
      authPolicy: 
        disabled: true
      timeoutPolicy: {{ $.Values.httpProxy.timeoutPolicy | toYaml | nindent 8 }}
      services:
        - name: {{ include "discovery-service.servicename" . }}
          port: {{ .Values.service.ports.http }}
{{- else -}}
### HTTPProxy (ingress) is disabled, see .Values.httpProxy.enabled 
{{- end }}
