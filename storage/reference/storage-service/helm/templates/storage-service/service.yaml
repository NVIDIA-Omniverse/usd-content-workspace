apiVersion: v1
kind: Service
metadata:
  name: {{ include "storage-service.servicename" . }}
  labels:
    {{- include "storage-service.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- $grpcPort := .Values.service.grpc.port }}
    {{- $restPort := .Values.service.rest.port }}
    {{- $metricsPort := .Values.service.metrics.port }}
    - port: {{ $grpcPort }}
      targetPort: {{ $grpcPort }}
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.grpc.nodePort }}
      {{- end }}
      protocol: TCP
      name: grpc
    {{- if .Values.service.metrics.enabled }}
    - port: {{ $metricsPort }}
      targetPort: {{ $metricsPort }}
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.metrics.nodePort }}
      {{- end }}
      protocol: TCP
      name: metrics
    {{- end }}
    - port: {{ $restPort }}
      targetPort: {{ $restPort }}
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.rest.nodePort }}
      {{- end }}
      protocol: TCP
      name: rest
  selector:
    {{- include "storage-service.selectorLabels" . | nindent 4 }}
