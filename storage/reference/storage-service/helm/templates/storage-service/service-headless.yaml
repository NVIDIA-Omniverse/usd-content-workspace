apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-headless" (include "storage-service.servicename" .) }}
  labels:
    {{- include "storage-service.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.grpc.port }}
      targetPort: {{ .Values.service.grpc.port }}
      protocol: TCP
      name: grpc
    {{- if .Values.service.metrics.enabled }}
    - port: {{ .Values.service.metrics.port }}
      targetPort: {{ .Values.service.metrics.port }}
      protocol: TCP
      name: metrics
    {{- end }}
    - port: {{ .Values.service.rest.port }}
      targetPort: {{ .Values.service.rest.port }}
      protocol: TCP
      name: rest
  selector:
    {{- include "storage-service.selectorLabels" . | nindent 4 }}
