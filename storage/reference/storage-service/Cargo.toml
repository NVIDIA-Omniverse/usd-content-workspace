[workspace]
members = [
  "storage-service",
  "storage-service-grpc",
  "storage-service-metrics",
  "storage-service-permissions",
  "storage-service-protos",
  "storage-service-test",
  "storage-service-util",
]
resolver = "3"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.96.1"
version = "1.2.3"

[profile.dev]
debug = "full"
incremental = true
opt-level = 1
strip = "none"

[profile.release]
codegen-units = 1
incremental = false
lto = "thin"
strip = "none"

[workspace.lints.clippy]
# Stupid lint. Some types are heavy to initialize.
new_without_default = "allow"

[workspace.dependencies]
ahash = "0.8.12"
anyhow = { version = "1.0.98", features = ["backtrace"] }
arrayvec = "0.7.6"
assert_matches = "1.5.0"
async-stream = "0.3"
async-trait = "0.1.88"
aws-config = "1.8.12"
aws-credential-types = "1.2.14"
aws-sdk-dynamodb = "1.110.0"
aws-sdk-s3 = "1.127.0"
aws-sdk-sqs = "1.97.0"
aws-smithy-runtime = { version = "1.10.3", features = ["client"] }
aws-smithy-runtime-api = { version = "1.11.6", features = ["client"] }
aws-smithy-types = "1.4.7"
axum = "0.8.8"
azservicebus = "0.21.0"
azure_core = { version = "0.21.0", features = ["enable_reqwest", "tokio-fs", "tokio-sleep"] }
azure_data_cosmos = { version = "0.21" }
azure_data_tables = "0.21.0"
azure_identity = "0.21.0"
azure_messaging_servicebus = "0.21"
azure_storage = "0.21"
azure_storage_blobs = { version = "0.21" }
base64 = "0.22"
bit-vec = "0.8"
blake3 = "1.8.3"
bytes = "1.11.1"
bytesize = { version = "2.0.1", features = ["serde"] }
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.50", features = ["cargo", "derive", "env"] }
deadpool-postgres = { version = "0.14.1", features = ["serde"] }
either = "1.15"
enum-map = { version = "2", features = ["serde"] }
envy = "0.4.2"
exponential-backoff = "2.1.0"
fastrand = "2.3.0"
figment = { version = "0.10.19", features = ["json", "toml"] }
fluent-uri = { version = "0.4.1", features = ["impl-error"] }
fred = { version = "10.1.0", features = ["enable-native-tls", "i-pubsub"] }
futures = "0.3.31"
get-size2 = { version = "0.7.3", features = ["bytes", "derive", "indexmap", "url"] }
hashbrown = "0.17.0"
hex = "0.4.3"
hex-literal = "1.0.0"
http = "1.3.1"
httpmock = "0.7.0"
humantime = "2.2.0"
humantime-serde = "1.1.1"
hyper = { version = "1.8.1", features = ["tracing"] }
hyper-proxy = "0.9.1"
hyper-tls05 = { package = "hyper-tls", version = "0.5.0" }
hyper-util = "0.1.14"
hyper014 = { package = "hyper", version = "0.14.32" }
indexmap = "2.10.0"
init-tracing-opentelemetry = { version = "0.34.0", features = ["tracing_subscriber_ext"] }
itertools = "0.14.0"
lazy_static = "1.5.0"
libc = "0.2.174"
linkme = "0.3.33"
metrics-macros = { path = "./metrics-macros" }
moka = { version = "0.12.15", features = ["future"] }
more-asserts = "0.3.1"
native-tls = "0.2.18"
once_cell = "1.21.3"
opentelemetry = { version = "0.31.0", features = ["trace"] }
opentelemetry-appender-tracing = "0.31.1"
opentelemetry-http = "0.31.0"
opentelemetry-otlp = { version = "0.31.0", features = ["grpc-tonic", "http-json", "http-proto"] }
opentelemetry-prometheus-text-exporter = "0.2.1"
opentelemetry-semantic-conventions = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", default-features = false, features = ["logs", "rt-tokio", "trace"] }
parking_lot = "0.12.4"
paste = "1.0.15"
percent-encoding = "2.3.1"
pin-project-lite = "0.2.17"
postgres = "0.19.14"
postgres-native-tls = "0.5.3"
postgres-protocol = "0.6.12"
prettyplease = "0.2.35"
procfs = "0.17.0"
prometheus = { version = "0.14.0", default-features = false }
prometheus-parse = "0.2.5"
prost = "0.14.1"
prost-types = "0.14.1"
protoc-bin-vendored = "3.2"
rand = { version = "0.9", features = ["thread_rng"] }
regex = "1.12.3"
regex-automata = { version = "0.4.14", features = ["alloc", "dfa-search"] }
reqwest = { version = "0.12.21", features = ["hickory-dns", "json"] }
rlimit = "0.10.2"
rstest = "0.18"
schematools = "0.22.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
serde_yaml = "0.9.34-deprecated"
serial_test = "3.5.0"
sha2 = "0.10.9"
snafu = { version = "0.8.6", features = ["futures", "rust_1_81"] }
stdext = "0.3.3"
storage-core = { path = "../storage-core/storage-core", features = ["full"] }
storage-core-protos = { path = "../storage-core/storage-core-protos" }
storage-core-util = { path = "../storage-core/storage-core-util" }
strum = { version = "0.27.1", features = ["derive"] }
syn = "2.0.104"
sysinfo = "0.35.2"
tempfile = "3.20.0"
test-log = { version = "0.2", features = ["default", "trace"] }
thiserror = "1"
time = { version = "0.3.47", features = ["serde"] }
tokio = { version = "1.50.0", features = ["net", "rt", "sync", "time"] }
tokio-native-tls = "0.3.1"
tokio-postgres = "0.7.18"
tokio-stream = "0.1.18"
tokio-util = "0.7.18"
toml = "0.9.7"
tonic = { version = "0.14.2", features = ["tls-aws-lc", "tls-native-roots"] }
tonic-build = "0.14.1"
tonic-error = "0.3.0"
tonic-health = "0.14.1"
tonic-prost = "0.14.2"
tonic-prost-build = "0.14.2"
tonic-reflection = "0.14.1"
tower = { version = "0.5.2", features = ["limit", "load", "load-shed", "timeout", "util"] }
tracing = "0.1.41"
tracing-appender = "0.2.4"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3.19", features = ["chrono", "env-filter", "fmt", "json", "parking_lot", "serde"] }
url = { version = "2.5.4", features = ["serde"] }
url-escape = "0.1.1"
url_normalizer = { path = "../../../common/url-normalizer" }
urlencoding = "2.1.3"
utoipa = "5"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = "1.17.0"

storage-service-grpc = { path = "storage-service-grpc" }
storage-service-metrics = { path = "storage-service-metrics" }
storage-service-protos = { path = "storage-service-protos" }
storage-service-util = { path = "storage-service-util" }

[patch.crates-io]
azure_core = { path = "../externals/azure-sdk/sdk/core" }
azure_data_cosmos = { path = "../externals/azure-sdk/sdk/data_cosmos" }
azure_identity = { path = "../externals/azure-sdk/sdk/identity" }
azure_messaging_servicebus = { path = "../externals/azure-sdk/sdk/messaging_servicebus" }
azure_storage = { path = "../externals/azure-sdk/sdk/storage" }
azure_storage_blobs = { path = "../externals/azure-sdk/sdk/storage_blobs" }
