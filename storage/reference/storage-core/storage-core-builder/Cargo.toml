[package]
description = "NVIDIA Omniverse Storage Core Builder"
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
name = "storage-core-builder"
repository.workspace = true
rust-version.workspace = true
version = "0.8.0-alpha.2"

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
axum-tracing-opentelemetry = "=0.33.0"
bytes = "1.12.1"
futures = "0.3.34"
http = "1.5.0"
http-body = "1.1.0"
lazy_static = "1.5.0"
opentelemetry = "=0.31.0"
paste = "1.0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
snafu = { version = "0.9.2", features = ["futures", "rust_1_81"] }
storage-core-protos = { version = "0.29.0-alpha.1", path = "../storage-core-protos" }
storage-core-types = { version = "0.6.0-alpha.1", path = "../storage-core-types" }
storage-core-util = { version = "0.11.0-alpha.1", path = "../storage-core-util" }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tonic = "0.14.6"
tonic-health = "0.14.6"
tonic-reflection = "0.14.6"
tonic-tracing-opentelemetry = "=0.32.1"
tonic-types = "0.14.6"
tower = "0.5.3"
tower-otel = "=0.9.0"
tracing = "0.1.44"
tracing-futures = { version = "0.2.5", features = ["futures-03", "std-future"] }
url = { version = "2.5.8", features = ["serde"] }
utoipa = "5.5.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "debug-embed"] }

[dev-dependencies]
serial_test = "3.5.0"
