[package]
description.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
name = "storage-core-integration-tests"
repository.workspace = true
rust-version.workspace = true
version = "0.4.1"

[features]
default = []

[dependencies]
assert_matches = "1.5.0"
aws-credential-types = "1.2.14"
aws-sdk-s3 = { version = "1.137.0", features = ["behavior-version-latest"] }
azure_core = { version = "0.21.0", features = ["enable_reqwest"] }
azure_identity = "0.21.0"
azure_storage = "=0.21.0"
azure_storage_blobs = { version = "0.21" }
base64 = "0.22.1"
bytes = "1.12.1"
bytesize = "2.7.0"
figment = "0.10.19"
fred = { version = "10.1.0", features = ["i-scripts", "sha-1", "subscriber-client"] }
futures = "0.3.34"
hex-literal = "1.1.0"
http = "1.5.0"
percent-encoding = "2.3.2"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["hickory-dns", "json", "native-tls"] }
rstest = "0.26.1"
serde_json = "1.0.151"
sha2 = "0.11.0"
storage-core = { version = "0.11.0-alpha.3", path = "../storage-core", features = [
  "full",
] }
storage-core-protos = { version = "0.29.0-alpha.1", path = "../storage-core-protos" }
storage-core-test = { version = "0.9.0-alpha.1", path = "../storage-core-test" }
storage-core-util = { version = "0.11.0-alpha.1", path = "../storage-core-util" }
tempfile = "3.27.0"
test-log = { version = "0.2.21", features = ["trace"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tonic = "0.14.6"
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
