[package]
description = "NVIDIA Omniverse Storage Core Utilities"
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
name = "storage-core-util"
repository.workspace = true
rust-version.workspace = true
version = "0.11.0-alpha.1"

[dependencies]
base64 = "0.22.1"
bytes = "1.12.1"
bytesize = "2.7.0"
clap = { version = "4.6.6", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["env", "json", "test", "toml", "yaml"] }
fred = { version = "10.1.0", features = ["i-scripts", "sha-1", "subscriber-client"] }
futures = "0.3.34"
hex = "0.4.3"
http = "1.5.0"
humantime = "2.4.0"
humantime-serde = "1.1.1"
hyper = "1.11.0"
init-tracing-opentelemetry = { version = "=0.34.0", features = ["logfmt", "metrics", "tracing_subscriber_ext"] }
linkme = "0.3.37"
moka = { version = "0.12.16", features = ["future"] }
once_cell = "1.21.4"
opentelemetry = "=0.31.0"
opentelemetry-otlp = { version = "=0.31.0", features = ["gzip-tonic"] }
opentelemetry_sdk = "=0.31.0"
parking_lot = "0.12.5"
paste = "1.0.15"
percent-encoding = "2.3.2"
pin-project = "1.1.13"
postcard = { version = "1.1.3", features = ["alloc"] }
prost = "0.14.4"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["rc"] }
serde_json = "1.0.151"
snafu = { version = "0.9.2", features = ["rust_1_81"] }
stdext = "0.3.3"
storage-core-protos = { version = "0.29.0-alpha.1", path = "../storage-core-protos" }
storage-core-types = { version = "0.6.0-alpha.1", path = "../storage-core-types" }
tokio = { version = "1.53.1", features = ["full"] }
tonic = "0.14.6"
tower = "0.5.3"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter", "json", "parking_lot", "serde"] }
url = "2.5.8"

[dev-dependencies]
# `i-client` (CLIENT KILL et al.) is only needed by the Redis reconnect regression test; keeping it
# out of the normal dependency means production binaries don't link the admin-command surface.
fred = { version = "10.1.0", features = ["i-client"] }
serial_test = "3.5.0"
tempfile = "3.27.0"
test-log = "0.2.21"

[package.metadata.cargo-machete]
ignored = ["humantime-serde"]
