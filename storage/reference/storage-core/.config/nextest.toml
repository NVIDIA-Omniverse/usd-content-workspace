[profile.default]
# Keep workspace runs broad for normal crates while limiting the expensive
# storage-core-integration-tests crate to its smoke subset. For named rstest
# cases, default runs case_01 and case_02 and leaves later cases to broader
# integration profiles.
default-filter = '''
not package(storage-core-integration-tests)
or (package(storage-core-integration-tests) and (
    not (
        test(/_full/)
        or test(/_cdn/)
        or test(/^cdn_/)
        or test(/_too_long/)
        or test(/stat_blob_name_control_chars/)
        or test(/none_requests/)
        or test(/write_.*_after_file_change/)
        or test(/copy_overwrite/)
        or test(/copy_after_source_change/)
        or test(/copy_after_dest_change/)
        or test(/delete_after_file_change/)
        or test(/write_between_stat_and_read/)
        or test(/move_overwrite/)
        or test(/move_after_source_change/)
        or test(/move_after_destination_change/)
        or test(/case_(0[3-9]|[1-9][0-9])_/)
    )
))
'''

