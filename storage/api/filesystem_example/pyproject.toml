[tool.poetry]
name = "omniverse-filesystem-storage-service"
version = "1.0.0b6.dev24+g0d287bd"
description = "Local filesystem example implementation of NVIDIA Omniverse USD Storage API"
readme = "README.md"
authors = ["NVIDIA CORPORATION & AFFILIATES"]
license = "Apache-2.0"
keywords = ["storage", "filesystem", "grpc", "rest", "api", "nvidia", "omniverse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [
    {include = "local_filesystem_service", from = "src"},
    {include = "nvidia", from = "src"},
]
# Have to override the .gitignore rule for the generated protoc output. Poetry otherwise will ignore these files
include = [{ path = 'src/nvidia', format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = "^3.10"
grpcio = ">=1.84.0"
grpcio-tools = ">=1.84.0"
grpcio-reflection = ">=1.84.0"
grpc-interceptor = ">=0.15.4"
googleapis-common-protos = ">=1.75.2"
fastapi = ">=0.141.1"
pydantic = ">=2.13.5"
uvicorn = ">=0.52.4"
PyYAML = ">=6.0.3"
typer = ">=0.27.2"
filelock = ">=3.32.5"

[tool.poetry.group.test.dependencies]
pytest = ">=9.1.1"
pytest-bdd = ">=8.1.0"
pytest-xdist = ">=3.8.0"
requests = ">=2.34.2"

[tool.poetry.group.dev.dependencies]
black = ">=26.5.1"
isort = ">=9.0.1"
mypy = ">=2.3.1"

[tool.poetry.scripts]
local-filesystem-service = "local_filesystem_service.__main__:main"
local-filesystem-grpc = "local_filesystem_service.grpc_service.__main__:main"
local-filesystem-rest = "local_filesystem_service.rest_service.__main__:main"

[build-system]
requires = ["poetry-core>=2.4.1"]
build-backend = "poetry.core.masonry.api"
