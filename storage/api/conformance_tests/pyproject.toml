[tool.poetry]
name = "omniverse-storageapi-conformance-tests"
version = "1.0.0b6.dev24+g0d287bd"
description = "Conformance test-suite to validate a Storage API implementation"
authors = ["NVIDIA CORPORATION & AFFILIATES"]
license = "Apache-2.0"
keywords = ["storage", "filesystem", "grpc", "rest", "api", "nvidia", "omniverse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [
    {include = "conformance_tests", from = "src"},
    {include = "nvidia", from = "src"},
]
# Have to override the .gitignore rule for the generated protoc output. Poetry otherwise will ignore these files
include = [{ path = 'src/nvidia', format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = "^3.10"
grpcio = ">=1.84.0"
grpcio-tools = ">=1.84.0"
grpcio-reflection = ">=1.84.0"
googleapis-common-protos = ">=1.75.2"
fastapi = ">=0.141.1"
pydantic = ">=2.13.5"
uvicorn = ">=0.52.4"
PyYAML = ">=6.0.3"
typer = ">=0.27.2"
psutil = ">=7.2.2"
types-toml = ">=0.10.8.20260518"
types-PyYAML = ">=6.0.12.20260815"
types-requests = ">=2.33.0.20260712"
types-protobuf = ">=7.35.1.20260827"
lxml = ">=6.1.2"
pytest = ">=9.1.1"
pytest-bdd = ">=8.1.0"
pytest-xdist = ">=3.8.0"
requests = ">=2.34.2"
mypy = ">=2.3.1"
mypy-gitlab-code-quality = ">=1.3.0"
pytest-dotenv = ">=0.5.2"
pytest-cov = ">=7.1.0"

[tool.poetry.group.dev.dependencies]
black = ">=26.5.1"
isort = ">=9.0.1"
pre-commit = ">=4.6.2"
myst-parser = ">=4.0.1"
boto3 = ">=1.43.86"
sphinx-markdown-builder = ">=0.6.11"

[tool.poetry.scripts]
run-conformance-tests = "conformance_tests:run_tests"

[build-system]
requires = ["poetry-core>=2.4.1"]
build-backend = "poetry.core.masonry.api"
