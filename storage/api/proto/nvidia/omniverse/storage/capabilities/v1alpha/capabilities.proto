syntax = "proto3";

package nvidia.omniverse.storage.capabilities.v1alpha;

option go_package = "pb.api.nvidia.com/omniverse/storage/capabilities/v1alpha;storage";
option java_multiple_files = true;
option java_outer_classname = "CapabilitiesProto";
option java_package = "com.nvidia.omniverse.storage.capabilities.v1alpha";

// The CapabilitiesService is used to reflect on which services are implemented by this server.
// Each service in turn exposes another service-specific capabilities query,
// to read data from remote storage.
service CapabilitiesService {
  // Return the list of service API implemented by this service
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
  // Return a list of top level resource addresses that is suited for browsing this storage service by the user.
  rpc ListTopLevelAddresses(ListTopLevelAddressesRequest) returns (ListTopLevelAddressesResponse);
  // Return the list of routes (for addresses and identities) served by this service instance.
  // This can be used for automatically routing resource addresses and identities to the correct storage service instance.
  // A route definition may include '*' / '**' wildcards; see the Route message for the pattern syntax.
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);
}

// Empty message to call the ListServicesRequest.
message ListServicesRequest {}

// Response of the ListServices call
message ListServicesResponse {
  // List of services with details implemented by this Storage API server
  repeated ServiceEntry services = 1;
}

// One Service is described via name and a list of versions supported by this server
message ServiceEntry {
  // The name of the service, e.g. fileobject
  // (-- api-linter: core::0122::name-suffix=disabled
  //     aip.dev/not-precedent: "service_name" is better than "service" --)
  string service_name = 1;
  // List of versions supported for this service, e.g. v1, v2alpha1, v2beta
  repeated string service_versions = 2;
}

// Empty message to call the ListTopLevelAddresses method
message ListTopLevelAddressesRequest {}

// The List of top level resource addresses served by this service instance.
// This is a convenience function to allow UI clients to explore the data exposed by this storage service, and does
// not need to be complete. I.e. it could list a number of buckets configured, but still allow to access arbitrary
// public buckets without needing to enumerate all of them.
message ListTopLevelAddressesResponse {
  // A list of top level resource addresses
  repeated TopLevelAddressEntry items = 1;
}

// Empty message to call the ListRoutes method
message ListRoutesRequest {}

// The ListRoutes method returns a list of patterns the client can use to match resource addresses and identities
// against and determine if this storage service instance will be able to serve the content referenced.
//
// A client may query several storage service deployments and combine their routes. When a resource address
// matches routes advertised by more than one deployment, the most specific route wins. Specificity is compared
// position by position over the matched address: at each address character a literal pattern character is more
// specific than a single '*' (one segment), which is more specific than a trailing '**' (the open-ended tail).
// A route is more specific than another when it is at least as specific at every position and strictly more
// specific at some position. For example, for the address 'https://a.s3.eu-central-1.amazonaws.com/scene.usd',
// 'https://a.s3.eu-central-1.amazonaws.com/**' beats 'https://*.s3.eu-central-1.amazonaws.com/**' (a literal host
// beats a wildcard; the length of the bucket name is irrelevant), and 'https://*.s3.*.amazonaws.com/my-bucket/**'
// beats 'https://*.s3.*.amazonaws.com/**' (the literal '/my-bucket/' is more specific even though it follows the
// wildcards and both share the same literal prefix 'https://' before their first '*'). When neither route is more
// specific than the other -- each is literal where the other is a wildcard, e.g.
// 'https://*.s3.us-east-1.amazonaws.com/**' versus 'https://bucket.s3.*.amazonaws.com/**' both matching
// 'https://bucket.s3.us-east-1.amazonaws.com/model.usd' -- the match is ambiguous and the route whose pattern
// string sorts first lexicographically is chosen. That tie-break carries no meaning; it exists only so that every
// client routes an ambiguous address to the same deployment.
message ListRoutesResponse {
  // A list of Route definitions
  repeated Route items = 1;
}

// One TopLevelAddress
message TopLevelAddressEntry {
  // The root of a namespace. All resource addresses that start with this prefix are considered to be within this namespace
  string top_level_address = 1;
}

// A Route entry
message Route {
  // Prepare for different types of Route definitions by using a oneof type here.
  oneof route_type {
    // Simple wildcard pattern.
    //
    // A single '*' matches exactly one identifier segment ([a-zA-Z0-9_-]+). One or more '*' may
    // appear before the end of the pattern -- for example 'https://*.s3.*.amazonaws.com/my-bucket/**'
    // matches every object in that bucket across regions. Two '*' must not be adjacent: a pattern such as
    // 'https://**.amazonaws.com/' is invalid, because '**' is reserved for the trailing token
    // described below.
    //
    // A trailing '**' matches any substring, i.e. all sub-URLs under the prefix. A pattern must end
    // with '**' to match sub-URLs; without a trailing '**' it matches only the exact resource
    // address, not anything beneath it.
    string wildcard_pattern = 1;
  }
}
