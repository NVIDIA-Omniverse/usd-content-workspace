syntax = "proto3";
package nvidia.omniverse.storage.versioning.v1alpha;

import "nvidia/omniverse/storage/fileobject/v1alpha/fileobject.proto";

option go_package = "pb.api.nvidia.com/omniverse/storage/versioning/v1alpha;storage";
option java_multiple_files = true;
option java_outer_classname = "VersioningProto";
option java_package = "com.nvidia.omniverse.storage.versioning.v1alpha";

// The VersioningService provides methods to manage versions of data objects.
service VersioningService {
  // List versions of a data object at the specified resource address.
  rpc EnumerateVersions(EnumerateVersionsRequest) returns (stream EnumerateVersionsResponse);
  // Return true if versioning is supported for the given resource address.
  rpc IsVersioned(IsVersionedRequest) returns (IsVersionedResponse);
}

// IsVersionedRequest is the request message for checking versioning support.
message IsVersionedRequest {
  // The resource address to check for versioning support. Capability queries take a resource
  // address and are answered for any resource address; a service is free to apply versioning
  // uniformly across a top-level address / namespace (e.g. if a top-level address is versioned,
  // every resource under it is) and document that, but clients must not be required to compute
  // the top-level address for a resource they are interested in.
  string resource_address = 1;
}

// IsVersionedResponse indicates whether the given resource address supports versioning.
message IsVersionedResponse {
  // True if the resource address supports versioning.
  bool is_versioned = 1;
}

// EnumerateVersionsRequest is the request message for listing versions.
message EnumerateVersionsRequest {
  // The resource address to list versions for.
  string resource_address = 1;
}

// EnumerateVersionsResponse represents a page of version information.
message EnumerateVersionsResponse {
  // A single page of results.
  repeated VersionInfo items = 1;

  // The order of returned versions.
  VersionsOrder versions_order = 2;
}

// The VersionInfo message contains the ResourceInfo and optional sorting_key.
message VersionInfo {
  // The ResourceIdentity of the data object, which can be used to download the data via Read()
  fileobject.v1alpha.ResourceInfo resource_info = 1;

  // sorting_key for sorting
  optional string sorting_key = 2;

  // Optionally, a resource address to the version that can be used with ReadFromAddress() instead of Read() via the identity
  optional string resource_address = 3;
}

// An enum for the different type of versions order.
enum VersionsOrder {
  // ORDER_UNSPECIFIED to detect unset or invalid values.
  VERSIONS_ORDER_UNSPECIFIED = 0;

  // From latest to newest
  VERSIONS_ORDER_NEWEST_FIRST = 1;

  // From newest to latest
  VERSIONS_ORDER_OLDEST_FIRST = 2;

  // Sort versions by sorting_key in ascending lexicographical order.
  VERSIONS_ORDER_BY_KEY = 3;
}
