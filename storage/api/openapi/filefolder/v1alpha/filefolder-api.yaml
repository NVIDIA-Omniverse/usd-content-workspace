openapi: 3.0.0
info:
  description: NVIDIA Omniverse Storage API FileFolder service.
  title: nvidia.omniverse.storage.filefolder.v1alpha
  version: 1.0.0-beta.6.dev26+gfa7f6fe
security:
  - bearerAuth: []
paths:
  /filefolder/{folder_address}:
    put:
      summary: Create a folder at the given resource address
      description: Create a folder at the given resource address.
      operationId: create_folder
      parameters:
        - $ref: '#/components/parameters/folder_address'
      responses:
        '204':
          description: Folder created successfully or already exists (idempotent)
        '400':
          description: Invalid folder address
        '409':
          description: Conflict - resource already exists as a file
  /filefolder/get-folder-mode/{folder_address}:
    get:
      summary: Get folder mode for the given resource address
      description: Determine if this address is within a namespace where folders are a native object.
      operationId: get_folder_mode
      parameters:
        - $ref: '#/components/parameters/folder_address'
      responses:
        '200':
          description: Successful Response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFolderModeResponse'
        '400':
          description: Invalid folder address
  /filefolder/list/{folder_address}:
    get:
      summary: List sub-items at the given resource address
      description: List sub-items at the given resource address.
      operationId: list
      parameters:
        - $ref: '#/components/parameters/folder_address'
        - $ref: '#/components/parameters/max_page_size'
        - $ref: '#/components/parameters/continuation_handle'
      responses:
        '200':
          description: Successful Response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResult'
    delete:
      summary: Delete the folder in case it exists and it is empty
      operationId: delete_folder
      parameters:
        - $ref: '#/components/parameters/folder_address'
      responses:
        '204':
          description: Successful Response
  /filefolder/liststat/{folder_address}:
    get:
      summary: List sub-items at the given resource address and return metadata and resource identities
      description: List sub-items at the given resource address and return metadata and resource identities.
      operationId: list_stat
      parameters:
        - $ref: '#/components/parameters/folder_address'
        - $ref: '#/components/parameters/max_page_size'
        - $ref: '#/components/parameters/continuation_handle'
        - $ref: '#/components/parameters/include_native_metadata'
      responses:
        '200':
          description: Successful Response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListStatResult'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    folder_address:
      required: true
      description: A Folder Address, following RFC 3986
      schema:
        type: string
        maxLength: 4096
        format: folder_address
      name: folder_address
      in: path
    include_native_metadata:
      name: include_native_metadata
      in: query
      required: false
      description: |
        When true, ListStat must include FileObject native metadata for returned file entries where FileObject native metadata is supported. This may require additional backend lookups on storage systems whose native list operation does not return object metadata. When false or omitted, ListStat may omit native_metadata if fetching it would require extra work.
      schema:
        type: boolean
        default: false
    max_page_size:
      in: query
      name: max_page_size
      description: The maximum size of the page to be returned by the server.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 65536
        nullable: true
    continuation_handle:
      name: continuation_handle
      description: The continuation handle to fetch the next page of results.
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
        format: page_handle
        nullable: true
  schemas:
    ListResult:
      properties:
        subfolder_addresses:
          title: Batch of folder addresses that can be listed.
          type: array
          maxItems: 65536
          items:
            type: string
            maxLength: 4096
            format: folder_address
        sub_resource_addresses:
          title: Batch of addresses for file objects.
          type: array
          maxItems: 65536
          items:
            type: string
            maxLength: 4096
            format: resource_address
        next_continuation_handle:
          type: string
          maxLength: 512
          format: page_handle
          nullable: true
          title: A handle by which enumerating can be continued.
      type: object
      required:
        - subfolder_addresses
        - sub_resource_addresses
      title: ListResult
      description: The response of the list operation.
    ListStatResult:
      properties:
        subfolder_addresses:
          title: Batch of resource addresses that can be listed.
          type: array
          maxItems: 65536
          items:
            type: string
            maxLength: 4096
            format: folder_address
        entries:
          title: Batch of detail data for file objects.
          type: array
          maxItems: 65536
          items:
            $ref: '#/components/schemas/ListItem'
        next_continuation_handle:
          type: string
          maxLength: 512
          format: page_handle
          nullable: true
          title: A handle by which enumerating can be continued.
      type: object
      required:
        - subfolder_addresses
        - entries
      title: ListStatResult
      description: The response of the list operation.
    ListItem:
      properties:
        resource_address:
          type: string
          maxLength: 4096
          format: resource_address
        resource_identity:
          type: string
          maxLength: 4096
          format: resource_identity
        metadata:
          $ref: '#/components/schemas/Metadata'
      type: object
      required:
        - resource_address
        - resource_identity
        - metadata
      title: ListItem
      description: A single item resolved by the list-stat operation delivering resource identities and metadata for each item.
    GetFolderModeResponse:
      properties:
        folder_mode:
          title: The return value of the function as enum string
          type: string
          enum:
            - native
            - no_empty
            - hybrid
      type: object
      required:
        - folder_mode
      title: GetFolderModeResponse
      description: Response object for the get_folder_mode query.
    Metadata:
      properties:
        data_object_size:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          title: The size of the asset, in bytes.
          format: int64
        last_modified_timestamp:
          type: string
          format: date-time
          maxLength: 32
          title: Timestamp (ISO-8601 UTC) of the last modification of the object. Exact semantics and precision are storage-type specific. This field may be omitted.
        native_metadata:
          type: object
          title: Native storage metadata.
          description: |
            FileObject-native metadata attached to this data object version. Values are arbitrary JSON values and are returned by FileObject APIs that expose metadata. This metadata is distinct from standalone MetadataService user metadata and may include storage-service-generated entries that were not supplied by the client, such as a backend ETag. Empty or absent native_metadata is not a support signal; clients should query the FileObject native metadata support endpoint for the resource address before relying on this field.
          additionalProperties: {}
      type: object
      required:
        - data_object_size
      title: Metadata
      description: A single resource metadata record, including FileObject-native metadata when available.
