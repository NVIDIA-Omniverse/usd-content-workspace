openapi: 3.0.0
info:
  description: NVIDIA Omniverse Storage API File Object service.
  title: nvidia.omniverse.storage.fileobject.v1alpha
  version: 1.0.0-beta.6.dev24+g0d287bd
security:
  - bearerAuth: []
paths:
  /fileobject/by-address/{resource_address}:
    head:
      operationId: stat
      summary: Get data object metadata at the given resource address.
      description: Retrieves resource identity and FileObject metadata, including native_metadata when available, of a data object at the specified resource address.
      parameters:
        - $ref: '#/components/parameters/resource_address'
      responses:
        '204':
          description: A successful stat operation will return 204 and the metadata in the response headers.
          headers:
            x-nvidia-omniverse-storage-metadata:
              description: A FileObject metadata record encoded in JSON, including native_metadata when available.
              required: true
              schema:
                type: string
                format: json-metadata
                maxLength: 4096
            x-nvidia-omniverse-storage-resource-identity:
              description: The identity of the referenced file object that can be used by a subsequent read operation.
              required: true
              schema:
                type: string
                maxLength: 4096
                format: resource_identity
    get:
      operationId: read_from_address
      summary: Download data object stored at the given address
      description: Download data object, either via 200/Body octet stream or by a 300 redirect response. Successful body responses include FileObject metadata with native_metadata when available.
      parameters:
        - $ref: '#/components/parameters/resource_address'
        - $ref: '#/components/parameters/download_preference'
      responses:
        '200':
          description: Successful Response, data in body.
          headers:
            x-nvidia-omniverse-storage-metadata:
              description: A FileObject metadata record encoded in JSON, including native_metadata when available.
              required: true
              schema:
                type: string
                format: json-metadata
                maxLength: 4096
            x-nvidia-omniverse-storage-resource-identity:
              description: The identity of the referenced file object.
              required: true
              schema:
                type: string
                maxLength: 4096
                format: resource_identity
          content:
            application/octet-stream:
              schema: {}
        '300':
          description: Redirect to an HTTP server via pre-signed URL, returns redirection information as JSON data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadRedirectProperties'
    put:
      summary: Upload new data to the given resource address.
      operationId: write
      description: |
        Upload new data provided in the body to the given resource address returning the metadata for an uploaded object.
        For large uploads, it's recommended that clients include the `Expect: 100-continue` header with their request.
        This allows the client to wait before streaming the request body until the storage API confirms it will accept
        the data.
      parameters:
        - $ref: '#/components/parameters/resource_address'
        - $ref: '#/components/parameters/previous_version'
        - $ref: '#/components/parameters/fail_if_exists'
        - $ref: '#/components/parameters/upload_preference'
        - $ref: '#/components/parameters/data_object_size'
        - $ref: '#/components/parameters/native_metadata'
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              title: Body
              type: string
              maxLength: 5497558138880
        required: false
      responses:
        '201':
          description: Successful Response. The returned ResourceInfo metadata includes native_metadata when available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceInfo'
        '300':
          description: Either a redirect to a different upload location or multipart request properties.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/WriteRedirectResponse'
                  - $ref: '#/components/schemas/MultipartUploadResponse'
        '400':
          description: |
            Invalid request. Returned when fail_if_exists=true is combined with previous_version on the same request (the two are mutually exclusive).
        '409':
          description: |
            Conflict. Returned when fail_if_exists=true and a resource already exists at the destination resource address.
        '501':
          description: |
            Not Implemented. Returned when the backend does not advertise support for the fail_if_exists flag on Write, or when a client sends valid non-empty native metadata to an address that does not support FileObject-native metadata.
    delete:
      operationId: delete
      summary: Delete a file object on storage. Deletes the object and all versions on storage.
      parameters:
        - $ref: '#/components/parameters/resource_address'
        - $ref: '#/components/parameters/previous_version'
      responses:
        '204':
          description: Successful Response
  /fileobject/by-address/{resource_address}/move:
    post:
      operationId: move
      summary: Move a data object with the specified resource address to a new resource address.
      parameters:
        - $ref: '#/components/parameters/resource_address'
      requestBody:
        required: true
        description: Parameters of a move operation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResponse'
        '400':
          description: |
            Invalid request. Returned when fail_if_exists=true is combined with destination_previous_version on the same request (the two are mutually exclusive).
        '409':
          description: |
            Conflict. Returned when fail_if_exists=true and a resource already exists at the destination resource address.
        '501':
          description: |
            Not Implemented. Returned when the backend does not advertise support for the fail_if_exists flag on Move.
  /fileobject/by-address/{resource_address}/redirect/complete:
    post:
      summary: Complete a redirect upload request
      description: Completes a multipart upload by assembling previously uploaded parts. The response will be a ResourceInfo struct containing information about the assembled data object.
      operationId: complete_redirect_upload
      parameters:
        - $ref: '#/components/parameters/resource_address'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
        required: true
      responses:
        '200':
          description: Successful Response. The returned ResourceInfo metadata includes native_metadata when available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceInfo'
  /fileobject/by-identity/{resource_identity}:
    get:
      operationId: read
      summary: Download data object referenced by the given resource identity
      description: Download data object, either via 200/Body octet stream or by a 300 redirect response. Successful body responses include FileObject metadata with native_metadata when available.
      parameters:
        - $ref: '#/components/parameters/resource_identity'
        - $ref: '#/components/parameters/download_preference'
      responses:
        '200':
          description: Successful Response, data in body.
          headers:
            x-nvidia-omniverse-storage-metadata:
              description: A FileObject metadata record encoded in JSON, including native_metadata when available.
              required: true
              schema:
                type: string
                format: json-metadata
                maxLength: 4096
            x-nvidia-omniverse-storage-resource-identity:
              description: The identity of the referenced file object.
              required: true
              schema:
                type: string
                maxLength: 4096
                format: resource_identity
          content:
            application/octet-stream:
              schema: {}
        '300':
          description: Redirect to an HTTP server via pre-signed URL, returns redirection information as JSON data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadRedirectProperties'
  /fileobject/data-objects/{resource_address}:
    get:
      operationId: enumerate
      summary: Enumerate data objects at resource address.
      description: |
        Recursively enumerate all data objects below the given location when the resource address points to an enumerable address. The result includes direct children and descendants at any depth.
      parameters:
        - $ref: '#/components/parameters/resource_address'
        - $ref: '#/components/parameters/max_page_size'
        - $ref: '#/components/parameters/continuation_handle'
      responses:
        '200':
          description: Successful Response, enumeration result in body in JSON format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnumerateResult'
  /fileobject/upload-options/by-address/{resource_address}:
    get:
      summary: Retrieve a list of the preferred upload methods for the file object at the specified address.
      parameters:
        - $ref: '#/components/parameters/resource_address'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadOptionsResponse'
  /fileobject/native-metadata-support/{resource_address}:
    get:
      operationId: get_native_metadata_support
      summary: Query native metadata support for a resource address.
      description: |
        Returns whether FileObject-native metadata is supported for the concrete resource address. The address may be a valid prospective write target before an object exists. The route uses the same path resource address encoding behavior as /fileobject/by-address/{resource_address}, including addresses that contain embedded slashes. A false response means clients must not send non-empty native metadata; services without support reject valid non-empty native metadata writes with 501. A 404, 405, or 501 response from an older service that does not expose this endpoint means clients cannot rely on native metadata support, but those services may ignore unknown native metadata input and complete ordinary writes without storing native metadata. Malformed addresses return 400 and authorization failures return 403; clients must not collapse those errors into unsupported.
      parameters:
        - $ref: '#/components/parameters/resource_address'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeMetadataSupportResponse'
        '400':
          description: Malformed or unsupported resource address for a write target.
        '403':
          description: Permission denied for a write-equivalent capability check at the resource address.
        '501':
          description: |
            Not Implemented. Older services may not expose this support endpoint; clients should treat this like absent native metadata support.
  /fileobject/is-read-only/{resource_address}:
    get:
      operationId: is_read_only
      summary: Query whether a resource address is read-only.
      description: |
        Returns whether the given resource address is read-only. A service may apply read-only uniformly across a top-level address / namespace and document that, but the query is answered for any resource address, so clients need not compute the top-level address themselves.
      parameters:
        - required: true
          schema:
            type: string
            maxLength: 4096
            format: resource_address
            title: ResourceAddress
          name: resource_address
          in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsReadOnlyResponse'
        '400':
          description: Resource address is not served by this service.
  /fileobject/by-address/{resource_address}/multipart/prepare:
    post:
      summary: Prepare a multipart upload request
      description: Get the presigned URL that allows one to upload a single part of the multipart upload. The response will be a UploadPartResponse struct containing the information required to start an HTTP upload of the data part.
      operationId: upload_part
      parameters:
        - $ref: '#/components/parameters/resource_address'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadPartRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadPartResponse'
  /fileobject/by-address/{resource_address}/multipart/complete:
    post:
      summary: Complete a multipart upload request
      description: Completes a multipart upload by assembling previously uploaded parts. The response will be a ResourceInfo struct containing information about the assembled data object.
      operationId: complete_multipart_upload
      parameters:
        - $ref: '#/components/parameters/resource_address'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteMultipartUploadRequest'
        required: true
      responses:
        '200':
          description: Successful Response. The returned ResourceInfo metadata includes native_metadata when available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceInfo'
  /fileobject/by-address/{resource_address}/multipart/abort:
    post:
      summary: Abort a multipart upload request
      description: Aborts a multipart upload and attempts to free any uploaded blocks.
      operationId: abort_multipart_upload
      parameters:
        - $ref: '#/components/parameters/resource_address'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbortMultipartUploadRequest'
        required: true
      responses:
        '204':
          description: Successful Response
  /fileobject/by-identity/{resource_identity}/copy:
    post:
      operationId: copy
      summary: Copy a data object with the specified identity.
      parameters:
        - $ref: '#/components/parameters/resource_identity'
      requestBody:
        required: true
        description: Parameters of a copy operation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopyResponse'
        '400':
          description: |
            Invalid request. Returned when fail_if_exists=true is combined with previous_version on the same request (the two are mutually exclusive).
        '409':
          description: |
            Conflict. Returned when fail_if_exists=true and a resource already exists at the destination resource address.
        '501':
          description: |
            Not Implemented. Returned when the backend does not advertise support for the fail_if_exists flag on Copy.
  /fileobject/optimistic-locking-support/{resource_address}:
    get:
      operationId: get_optimistic_locking_support
      summary: Query the server's support for optimistic locking.
      description: |
        Returns information about which operations support optimistic locking (conditional execution with previous_version parameter) for the given resource address. This allows clients to  determine capabilities before attempting conditional operations.
      parameters:
        - $ref: '#/components/parameters/resource_address'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimisticLockingSupportResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    native_metadata:
      name: x-nvidia-omniverse-storage-native-metadata
      in: header
      required: false
      description: |
        Optional FileObject-native metadata to store with the newly written data object version. The value is a JSON object encoded as a string with provider-specific key and value constraints. This metadata is distinct from standalone MetadataService user metadata. Clients should call /fileobject/native-metadata-support/{resource_address} for the target address before sending a non-empty value. If that endpoint reports supports_native_metadata=false, valid non-empty native metadata writes fail with 501; older services that do not know this header may ignore it and perform the write without native metadata. Malformed addresses, authorization failures, and malformed metadata remain explicit errors.
      schema:
        type: string
        format: json-native-metadata
        maxLength: 4096
    resource_address:
      required: true
      description: A Resource Address, the concrete format and semantics are storage-backend specific.
      schema:
        type: string
        maxLength: 4096
        format: resource_address
      name: resource_address
      in: path
    download_preference:
      in: query
      name: download_preference
      description: Preferred download method, either not specified to allow the server to decide, or one of the allowed enum values.
      required: false
      schema:
        type: string
        enum:
          - redirect
          - body
        nullable: true
    previous_version:
      description: Resource Identity of previous version.
      required: false
      schema:
        type: string
        maxLength: 4096
        format: resource_identity
      name: previous_version
      in: query
    fail_if_exists:
      name: fail_if_exists
      in: query
      description: |
        Create-only flag. When true, the operation fails if a resource already exists at the destination address. Mutually exclusive with previous_version: setting both on the same request is rejected with 400 Bad Request. Unset or false preserves the pre-feature behavior.
      required: false
      schema:
        type: boolean
        nullable: true
    upload_preference:
      name: upload_preference
      description: The desired way of the service reacting to the Write request.
      required: false
      in: query
      schema:
        $ref: '#/components/schemas/UploadPreference'
    data_object_size:
      name: data_object_size
      description: The size of the data object, bytes.
      required: true
      in: query
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
    resource_identity:
      required: true
      description: A Resource Identity references an immutable data object version.
      schema:
        type: string
        maxLength: 4096
        format: resource_identity
      name: resource_identity
      in: path
    max_page_size:
      in: query
      name: max_page_size
      description: The maximum size of the page to be returned by the server.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 65536
        nullable: true
    continuation_handle:
      name: continuation_handle
      description: The continuation handle to fetch the next page of results.
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
        format: page_handle
        nullable: true
  schemas:
    EnumerateResult:
      properties:
        next_continuation_handle:
          type: string
          maxLength: 512
          format: page_handle
          nullable: true
          title: A handle by which enumerating can be continued.
        items:
          type: array
          title: A single page of entries.
          maxItems: 65536
          items:
            $ref: '#/components/schemas/AddressInfo'
      type: object
      required:
        - items
      title: EnumerateResult
      description: A enumerate operation result.
    ReadRedirectProperties:
      properties:
        redirect_target_url:
          type: string
          maxLength: 4096
          format: uri
          title: The request URL.
        additional_headers:
          additionalProperties:
            type: string
            maxLength: 4096
            format: http_header
          type: object
          title: The associated request headers.
      type: object
      required:
        - redirect_target_url
        - additional_headers
      title: RequestProperties
      description: Properties of an HTTP request.
    UploadOptionsResponse:
      title: UploadOptionsResponse
      description: Upload options.
      type: object
      properties:
        write_type_intervals:
          title: A list of limits for upload methods.
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/WriteTypeInterval'
      required:
        - write_type_intervals
    NativeMetadataSupportResponse:
      title: NativeMetadataSupportResponse
      description: |
        Response indicating whether FileObject-native metadata is supported at the queried resource address. supports_native_metadata is the only support flag in this response.
      type: object
      additionalProperties: false
      properties:
        supports_native_metadata:
          type: boolean
          description: |
            True when valid non-empty FileObject-native metadata writes are accepted for this resource address. False means valid non-empty native metadata writes fail with 501. Ordinary FileObject responses may still return empty or backend-generated native_metadata.
      required:
        - supports_native_metadata
    IsReadOnlyResponse:
      title: IsReadOnlyResponse
      description: Response indicating whether a resource address is read-only.
      type: object
      additionalProperties: false
      properties:
        is_read_only:
          type: boolean
          description: True if the resource address is read-only.
      required:
        - is_read_only
    WriteTypeInterval:
      title: WriteTypeInterval
      description: Preferences for an upload method.
      type: object
      properties:
        minimum_data_object_size:
          title: The minimum data object size for which this upload method is recommended.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        maximum_data_object_size:
          title: The maximum data object size, it must be smaller than the maximum size for this upload method to be recommended
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        preferred_upload_method:
          title: Preferred upload method.
          allOf:
            - $ref: '#/components/schemas/UploadPreference'
      required:
        - minimum_data_object_size
        - maximum_data_object_size
        - preferred_upload_method
    WriteRedirectProperties:
      properties:
        redirect_target_url:
          type: string
          maxLength: 4096
          format: uri
          title: The request URL.
        method:
          title: The request method.
          type: string
          enum:
            - post
            - put
        additional_headers:
          type: array
          title: List of HTTP headers to be used alongside the redirect_target_url to upload the data.
          maxItems: 100
          items:
            $ref: '#/components/schemas/HttpHeader'
        completion_header_names:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 4096
          description: List of names from the HTTP headers returned upload required to be used as parameter to .../redirect/complete
      type: object
      required:
        - redirect_target_url
        - method
        - additional_headers
        - completion_header_names
      title: RequestProperties
      description: Properties of an HTTP request.
    WriteRedirectResponse:
      title: WriteRedirectResponse
      description: Redirect to a different write location.
      type: object
      properties:
        redirect:
          $ref: '#/components/schemas/WriteRedirectProperties'
      required:
        - redirect
    CompleteUploadRequest:
      properties:
        additional_headers:
          type: array
          title: List of HTTP headers gathered from the redirected upload operation.
          maxItems: 100
          items:
            $ref: '#/components/schemas/HttpHeader'
      required:
        - additional_headers
      type: object
      title: CompleteUploadRequest
      description: Optionally, complete the write operation after a write redirect to obtain the ResourceInfo
    MultipartUploadResponse:
      title: MultipartUploadResponse
      description: Properties of a newly initiated multipart upload for a file object.
      type: object
      properties:
        multipart:
          $ref: '#/components/schemas/MultipartUploadProperties'
      required:
        - multipart
    MultipartUploadProperties:
      title: MultipartUploadProperties
      description: Properties of a multipart upload.
      type: object
      properties:
        upload_id:
          type: string
          maxLength: 128
          format: upload_id
          title: ID that identifies this multipart upload operation.
        first_part_write_redirect:
          $ref: '#/components/schemas/WriteRedirectProperties'
        minimum_size_per_part:
          description: The minimum size of the part, bytes. A null or missing value means no limit is specified.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          nullable: true
        maximum_size_per_part:
          description: The maximum size of the part, bytes. A null or missing value means no limit is specified.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          nullable: true
        maximum_parts_number:
          description: The maximum number of parts per upload. A null or missing value means no limit is specified.
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          nullable: true
      required:
        - upload_id
        - first_part_write_redirect
    UploadPartRequest:
      properties:
        upload_id:
          type: string
          maxLength: 128
          format: upload_id
          title: ID that identifies this multipart upload operation.
        part_number:
          type: integer
          minimum: 0
          maximum: 65535
          title: Sequential part number.
        part_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 65536
          nullable: true
          description: To get more than one part per call, supply the count of parts that will be uploaded. Part number starts with part_number.
      required:
        - upload_id
        - part_number
      type: object
      title: UploadPartRequest
      description: Upload part request.
    UploadPartResponse:
      properties:
        part_write_redirects:
          type: array
          maxItems: 65536
          items:
            $ref: '#/components/schemas/WriteRedirectProperties'
      required:
        - part_write_redirects
      type: object
      title: UploadPartResponse
      description: Upload part response.
    CompleteMultipartUploadRequest:
      properties:
        upload_id:
          type: string
          maxLength: 128
          format: upload_id
          title: ID that identifies this multipart upload operation.
        parts:
          type: array
          title: List of all CompletedUploadPart parts needed to assemble the data object.
          maxItems: 2147483647
          items:
            $ref: '#/components/schemas/CompletedUploadPart'
      required:
        - upload_id
        - parts
      type: object
      title: CompleteMultipartUploadRequest
      description: Complete multipart upload request.
    CompletedUploadPart:
      properties:
        part_number:
          type: integer
          minimum: 0
          maximum: 2147483647
          title: Sequential part number.
        additional_headers:
          type: array
          title: List of HTTP headers gathered from the HTTP operation on the presigned URL.
          maxItems: 100
          items:
            $ref: '#/components/schemas/HttpHeader'
      required:
        - part_number
        - additional_headers
      type: object
      title: CompletedUploadPart
      description: Completed upload part.
    AbortMultipartUploadRequest:
      properties:
        upload_id:
          type: string
          maxLength: 128
          format: upload_id
          title: ID that identifies this multipart upload operation.
      required:
        - upload_id
      type: object
      title: AbortMultipartUploadRequest
      description: Abort a pending multipart upload request.
    CopyRequest:
      title: Copy Request
      description: Parameters of a copy operation.
      type: object
      properties:
        destination_resource_address:
          type: string
          maxLength: 4096
          format: resource_address
          title: The address of a destination file object.
        previous_version:
          title: Expected previous version identity.
          description: The resource identity of the previous version at the destination resource address. Copy will fail if this is no longer the latest version or the storage doesn't support conditional copies.
          type: string
          maxLength: 4096
          format: resource_identity
          nullable: true
        fail_if_exists:
          title: Fail if a resource already exists at the destination.
          description: |
            Create-only flag. When true, Copy fails with 409 Conflict if a resource already exists at destination_resource_address. Mutually exclusive with previous_version: setting both on the same request is rejected with 400 Bad Request. Unset or false preserves the pre-feature behavior.
          type: boolean
          nullable: true
      required:
        - destination_resource_address
    CopyResponse:
      title: Copy Response
      description: The result of a copy operation.
      type: object
      properties:
        resource_identity:
          $ref: '#/components/schemas/ResourceIdentity'
      required:
        - resource_identity
    MoveRequest:
      title: Move Request
      description: Parameters of a move operation.
      type: object
      properties:
        destination_resource_address:
          type: string
          maxLength: 4096
          format: resource_address
          title: The address of a destination file object.
        destination_previous_version:
          title: Expected previous version identity at the destination address.
          description: The resource identity of the previous version at the destination resource address. Move will fail if this is no longer the latest version or the storage doesn't support conditional moves.
          type: string
          maxLength: 4096
          format: resource_identity
          nullable: true
        fail_if_exists:
          title: Fail if a resource already exists at the destination.
          description: |
            Create-only flag. When true, Move fails with 409 Conflict if a resource already exists at destination_resource_address. Mutually exclusive with destination_previous_version: setting both on the same request is rejected with 400 Bad Request. Unset or false preserves the pre-feature behavior.
          type: boolean
          nullable: true
        source_previous_version:
          title: Expected previous version identity at the source address.
          description: The resource identity of the previous version at the source resource address. Move will fail if this is no longer the latest version or the storage doesn't support conditional moves.
          type: string
          maxLength: 4096
          format: resource_identity
          nullable: true
      required:
        - destination_resource_address
    MoveResponse:
      title: Move Response
      description: The result of a move operation.
      type: object
      properties:
        resource_identity:
          $ref: '#/components/schemas/ResourceIdentity'
      required:
        - resource_identity
    OptimisticLockingSupportResponse:
      title: OptimisticLockingSupportResponse
      description: |
        Response indicating which operations support optimistic locking (conditional execution with previous_version parameter). When an operation supports optimistic locking, clients can pass a previous_version parameter to ensure the operation only succeeds if the resource hasn't been modified since the specified version.
      type: object
      properties:
        supports_write:
          type: boolean
          description: |
            True if Write operations support conditional execution with previous_version. When true, clients can pass previous_version to Write to implement compare-and-swap semantics.
        supports_delete:
          type: boolean
          description: |
            True if Delete operations support conditional execution with previous_version. When true, clients can pass previous_version to Delete to ensure they're deleting the expected version.
        supports_copy:
          type: boolean
          description: |
            True if Copy operations support conditional execution with previous_version. When true, clients can pass previous_version to Copy to ensure the destination hasn't changed.
        supports_move:
          type: boolean
          description: |
            True if Move operations support conditional execution with source_previous_version and destination_previous_version. When true, clients can use these fields to ensure atomic moves with version checking.
        supports_write_fail_if_exists:
          type: boolean
          description: |
            True if Write operations honor the fail_if_exists flag (create-only semantic). Conformant v1alpha servers SHOULD include this field. Older servers that predate this capability may omit it, in which case clients should treat it as false.
        supports_copy_fail_if_exists:
          type: boolean
          description: |
            True if Copy operations honor the fail_if_exists flag (create-only semantic on the destination). Conformant v1alpha servers SHOULD include this field. Older servers that predate this capability may omit it, in which case clients should treat it as false.
        supports_move_fail_if_exists:
          type: boolean
          description: |
            True if Move operations honor the fail_if_exists flag (create-only semantic on the destination). Conformant v1alpha servers SHOULD include this field. Older servers that predate this capability may omit it, in which case clients should treat it as false.
      required:
        - supports_write
        - supports_delete
        - supports_copy
        - supports_move
    UploadPreference:
