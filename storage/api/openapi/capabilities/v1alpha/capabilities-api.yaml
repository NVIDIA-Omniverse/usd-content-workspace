openapi: 3.0.0
info:
  description: NVIDIA Omniverse Storage API Capabilities service.
  title: nvidia.omniverse.storage.capabilities.v1alpha
  version: 1.0.0-beta.6.dev24+g0d287bd
security:
  - bearerAuth: []
paths:
  /capabilities/services:
    get:
      summary: Return the list of service API implemented by this service
      description: Return the list of service API implemented by this service.
      operationId: list_services
      responses:
        '200':
          description: Successful Response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListServicesResult'
  /capabilities/top-level-addresses:
    get:
      summary: Return a list of top-level resource addresses suited for browsing.
      description: Return a list of top-level resource addresses suited for browsing this storage service.
      operationId: list_top_level_addresses
      responses:
        '200':
          description: Successful Response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTopLevelAddressesResult'
  /capabilities/routes:
    get:
      summary: Return the list of routing patterns for resource addresses and identities.
      description: Automatically routes resource addresses and identities to the correct storage service instance.
      operationId: list_routes
      responses:
        '200':
          description: Successful Response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRoutesResult'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ListServicesResult:
      title: ListServicesResult
      description: The response of the list_services operation.
      type: object
      required:
        - services
      properties:
        services:
          title: List of services with details implemented by this Storage API server
          type: array
          maxItems: 65536
          items:
            $ref: '#/components/schemas/ServiceEntry'
    ServiceEntry:
      title: ServiceEntry
      description: One service is described via its name and supported versions.
      type: object
      required:
        - service_name
        - service_versions
      properties:
        service_name:
          title: The name of the service, e.g. fileobject
          type: string
          maxLength: 4096
        service_versions:
          title: List of versions supported for this service, e.g. v1, v2alpha1, v2beta
          type: array
          maxItems: 256
          items:
            type: string
            maxLength: 4096
    ListTopLevelAddressesResult:
      properties:
        items:
          title: The list of top level resource addresses served by this service instance.
          type: array
          maxItems: 65536
          items:
            $ref: '#/components/schemas/TopLevelAddressEntry'
      type: object
      required:
        - items
      title: ListTopLevelAddressesResult
      description: This is a convenience function to allow UI clients to explore the data exposed by this storage service, and does not need to be complete.
    TopLevelAddressEntry:
      properties:
        top_level_address:
          title: The root of a namespace. All resource addresses that start with this prefix are considered to be within this namespace
          type: string
          maxLength: 4096
      type: object
      required:
        - top_level_address
      title: TopLevelAddressEntry
      description: TopLevelAddress
    ListRoutesResult:
      properties:
        items:
          title: The ListRoots method returns a list of patterns the client can use to match resource addresses and identities against.
          type: array
          maxItems: 65536
          items:
            $ref: '#/components/schemas/Route'
      type: object
      required:
        - items
      title: ListRoutesResult
      description: |
        The list of route patterns this storage service instance can serve, used by clients to route resource addresses and identities to the correct deployment. When a resource address matches routes advertised by more than one deployment, the most specific route wins. Specificity is compared position by position over the matched address: at each address character a literal pattern character is more specific than a single '*' (one segment), which is more specific than a trailing '**' (the open-ended tail). A route is more specific than another when it is at least as specific at every position and strictly more specific at some position -- so 'https://a.s3.eu-central-1.amazonaws.com/**' beats 'https://*.s3.eu-central-1.amazonaws.com/**' (literal host, regardless of bucket-name length), and 'https://*.s3.*.amazonaws.com/my-bucket/**' beats 'https://*.s3.*.amazonaws.com/**' (the literal '/my-bucket/' after the wildcards). When neither route is more specific than the other (each literal where the other is a wildcard, e.g. 'https://*.s3.us-east-1.amazonaws.com/**' versus 'https://bucket.s3.*.amazonaws.com/**'), the match is ambiguous and the route whose pattern string sorts first lexicographically is chosen, purely so that every client routes the address to the same deployment.
    Route:
      oneOf:
        - type: object
          properties:
            wildcard_pattern:
              type: string
              maxLength: 4096
              description: |
                Simple wildcard pattern. A single '*' matches exactly one identifier segment ([a-zA-Z0-9_-]+) and may appear at more than one position before the end of the pattern (e.g. 'https://*.s3.*.amazonaws.com/my-bucket/**' matches every object in that bucket across regions); two '*' must not be adjacent, since '**' is reserved for the trailing token. A trailing '**' matches any substring (all sub-URLs under the prefix); a pattern must end with '**' to match sub-URLs, and without a trailing '**' it matches only the exact resource address, not anything beneath it.
          required:
            - wildcard_pattern
      title: Route
      type: object
      description: Prepare for different types of Route definitions by using a oneof type here.
