apiVersion: v2
name: thumbnail-service
description: REST and gRPC APIs for thumbnail generation
type: application

# Both HPAs use the ContainerResource metric type, which is only enabled by default
# from 1.27 (beta) and stable from 1.30. On an older cluster the metric is dropped
# rather than rejected, so the HPA would sit at minReplicas with no error.
kubeVersion: ">=1.27.0-0"

