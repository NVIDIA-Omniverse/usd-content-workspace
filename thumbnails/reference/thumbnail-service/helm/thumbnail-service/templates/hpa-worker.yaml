{{- if and .Values.thumbnailWorker.enabled .Values.thumbnailWorker.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "worker.fullname" . }}
  labels:
    {{- include "worker.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "worker.fullname" . }}
  minReplicas: {{ .Values.thumbnailWorker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.thumbnailWorker.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.thumbnailWorker.autoscaling.targetCPUUtilizationPercentage }}
    # Conversion is CPU-bound, so this tracks the work the worker actually does.
    # ContainerResource (not the pod-aggregate Resource type) targets the
    # thumbnail-worker container specifically, so the metric depends only on
    # thumbnailWorker.resources and is unaffected by sidecar containers that
    # carry no CPU request of their own.
    - type: ContainerResource
      containerResource:
        name: cpu
        container: thumbnail-worker
        target:
          type: Utilization
          averageUtilization: {{ .Values.thumbnailWorker.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
{{- end }}
