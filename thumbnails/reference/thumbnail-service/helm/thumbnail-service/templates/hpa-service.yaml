{{- if .Values.thumbnailService.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "service.fullname" . }}
  minReplicas: {{ .Values.thumbnailService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.thumbnailService.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.thumbnailService.autoscaling.targetCPUUtilizationPercentage }}
    # ContainerResource (not the pod-aggregate Resource type) targets the
    # thumbnail-service container specifically, so the metric depends only on
    # thumbnailService.resources and is unaffected by sidecar containers that
    # carry no request of their own.
    - type: ContainerResource
      containerResource:
        name: cpu
        container: thumbnail-service
        target:
          type: Utilization
          averageUtilization: {{ .Values.thumbnailService.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.thumbnailService.autoscaling.targetMemoryUtilizationPercentage }}
    - type: ContainerResource
      containerResource:
        name: memory
        container: thumbnail-service
        target:
          type: Utilization
          averageUtilization: {{ .Values.thumbnailService.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
