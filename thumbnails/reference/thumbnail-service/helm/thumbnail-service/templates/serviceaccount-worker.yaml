{{- /*
Render nothing when both components resolve to the same ServiceAccount name: the
orchestrator's object is the one emitted and the worker just references it.

Two ways to land here, and the second is not hypothetical. A shared
`serviceAccount.name` is the deliberate one, since a Workload Identity federated
credential is keyed to a single name. The other is a component override that happens
to equal the other component's resolved name — which is exactly dev today, where the
release is named `thumbnail-service` (so the orchestrator's generated name collapses
to it) and the worker is pinned to `thumbnail-service` to keep its binding. Without
this guard that release renders two ServiceAccounts with one name, and whichever
applies last silently wins.
*/ -}}
{{- if and .Values.thumbnailWorker.enabled .Values.serviceAccount.create (ne (include "worker.serviceAccountName" .) (include "service.serviceAccountName" .)) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "worker.serviceAccountName" . }}
  labels:
    {{- include "worker.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
