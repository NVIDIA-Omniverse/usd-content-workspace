{{- if .Values.httpProxy.enabled -}}

{{-  $proxies  := dict "rest" (dict
                                    "hostPrefix" ""
                                    "targetSvc" (include "service.servicename" $)
                                    "targetPort" .Values.service.restPort
                                    "path" (.Values.httpProxy.path | default "/")
                                    "protocol" ""
                                    "values" (mustMergeOverwrite
                                      (deepCopy $.Values.httpProxy)
                                      (deepCopy $.Values.httpProxy.rest)
                                    )
                             )
                     "grpc"  (dict
                                    "hostPrefix" "grpc."
                                    "targetSvc" (include "service.servicename" $)
                                    "targetPort" .Values.service.grpcPort
                                    "protocol" "h2c"
                                    "path" "/"
                                    "values" (mustMergeOverwrite
                                      (deepCopy $.Values.httpProxy)
                                      (deepCopy $.Values.httpProxy.grpc)
                                    )
                             )

-}}
{{-  range $type, $config := $proxies }}
{{-  $fqdn := print $config.hostPrefix $config.values.fqdn.host "." $config.values.fqdn.domain -}}
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: {{ print (include "service.fullname" $) "-" $type }}
  {{- with $config.values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "service.labels" $ | nindent 4 }}
spec:
  virtualhost:
    fqdn: {{ $fqdn }}
    {{- if $config.values.tls.enabled }}
    tls:
      secretName: {{ include "service.tlsSecretName" $ }}
    {{- end }}
    {{- if $config.values.corsPolicy }}
    corsPolicy: {{ $config.values.corsPolicy | toYaml | nindent 6 }}
    {{- end }}
    {{- if $config.values.authExtension.enabled }}
    authorization:
      responseTimeout: {{ $config.values.authExtension.responseTimeout }}
      extensionRef:
        name: {{ $config.values.authExtension.extensionRef.name }}
        namespace: {{ $config.values.authExtension.extensionRef.namespace | default $.Release.Namespace }}
    {{- end }}
  routes:
    - conditions:
        - prefix: {{ $config.path }}
      {{- if $config.values.timeoutPolicy }}
      timeoutPolicy: {{ $config.values.timeoutPolicy | toYaml | nindent 8 }}
      {{- end }}
      services:
        - name: {{ $config.targetSvc }}
          port: {{ $config.targetPort }}
          {{- ternary "" ((print "protocol: "  $config.protocol) | nindent 10) (empty $config.protocol) }}
{{  end -}}
{{- else -}}
### HTTPProxy (ingress) is disabled, see .Values.httpProxy.enabled
{{- end }}
