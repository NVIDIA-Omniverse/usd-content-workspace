---
version: v2

# `include_wkt` is deliberately absent: prost maps well-known types onto
# `::prost_types`, so generating a `google::protobuf` module would commit a tree
# nothing references. We only call this service, never serve it through
# reflection, so its transitive descriptors are not needed either.
plugins:
  # Generates the base rust code for inputs
  - local: protoc-gen-prost
    out: src
    opt:
      - file_descriptor_set
    include_imports: true

    # Generates Tonic server and client. Server stubs are kept because the
    # in-process storage double in `test_fixtures` implements these service
    # traits to exercise storage-failure paths off a cluster.
  - local: protoc-gen-tonic
    out: src
    include_imports: true

  # Generates a crate for the rust files
  - local: protoc-gen-prost-crate
    out: .
    opt:
      - gen_crate=Cargo.toml.template
      - no_features
    strategy: all
    include_imports: true

# The module also publishes `v1beta` and several `v1test*` packages we do not
# call. Restricting the input to the three `v1alpha` packages keeps the generated
# surface to what the previous `build.rs` compiled; the packages left out are not
# referenced by the ones kept.
inputs:
  - directory: ../../../../../../storage/api/proto
    paths:
      - ../../../../../../storage/api/proto/nvidia/omniverse/storage/fileobject/v1alpha
      - ../../../../../../storage/api/proto/nvidia/omniverse/storage/metadata/v1alpha
      - ../../../../../../storage/api/proto/nvidia/omniverse/storage/filefolder/v1alpha
