[package]
name = "thumbnail-convert"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Deliberately a leaf crate. It must stay free of the Notification client, the
# HTTP stack, and any acknowledgement policy so a second caller — the approved
# synchronous `createThumbnail` mode — can link it without dragging the worker's
# world in. That also keeps the `image` codecs out of the `server` binary, which
# is why it does not depend on `thumbnail-common`: `thumbnail-common` is linked
# by `server`, and depending on it in either direction would put image decoders
# on the API deployment.
[dependencies]
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "rayon",
    "tiff",
    "webp",
] }
smartcrop2 = "0.4"
thiserror.workspace = true
