[package]
name = "thumbnail-service"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "generate_openapi"
path = "src/bin/generate_openapi.rs"

[dependencies]
axum.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
tokio.workspace = true
tokio-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
dotenvy.workspace = true
reqwest.workspace = true
uuid.workspace = true
futures.workspace = true
tonic.workspace = true
tonic-reflection.workspace = true
tonic-health.workspace = true
prost-types.workspace = true
utoipa.workspace = true
utoipa-swagger-ui = { version = "9", features = ["axum"] }
tower-http = { version = "0.5", features = ["cors", "timeout"] }
tonic-observability.workspace = true
axum-observability = { version = "0.14.0", path = "../../vendor/axum-observability" }
opentelemetry.workspace = true
tracing-opentelemetry.workspace = true

thumbnail-common = { path = "../common" }
thumbnail-proto = { path = "../proto/thumbnail" }
discovery-proto = { path = "../proto/discovery" }

[dev-dependencies]
# Enables the shared test doubles for this crate's own tests only.
thumbnail-common = { path = "../common", features = ["test-utils"] }
serial_test.workspace = true
tower = { version = "0.5", features = ["util"] }
# The format axum's Query extractor parses, so parity tests can exercise the real
# HTTP request mapping instead of hand-building the model it would have produced.
serde_urlencoded = "0.7"
wiremock.workspace = true
tokio-stream.workspace = true
# For mock FileObjectService in create_thumbnails handler tests
storage-proto = { path = "../proto/storage" }
