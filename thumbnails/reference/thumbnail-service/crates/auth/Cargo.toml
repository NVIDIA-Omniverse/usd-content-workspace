[package]
name = "thumbnail-auth"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

publish = false

[dependencies]
# Shared service-identity types and outbound gRPC interceptors. The
# access-token-file / client-credentials flows and `service_identity` types
# now live in `permission-auth` (vendored under vendor/permission-auth) rather
# than being copy-pasted into this crate. The `grpc` feature gates the
# outbound `tonic` interceptors.
permission-auth = { version = "0.0.51-rc.17", path = "../../vendor/permission-auth", features = ["grpc"] }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
tonic = { workspace = true }

[dev-dependencies]
# A loopback listener answering raw HTTP is enough to drive the discovery error
# paths; a mock-HTTP crate would be a new dependency for two tests.
tokio = { workspace = true }
