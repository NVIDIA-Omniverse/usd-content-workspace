# Vendored from axum-observability 0.14.0 (tonic-observability); see README.md.

[package]
edition = "2024"
rust-version = "1.91.0"
name = "axum-observability"
version = "0.14.0"
authors = ["NVIDIA"]
build = false
include = [
    "/src",
    "/LICENSE.txt",
    "/README.md",
]
publish = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Tracing and metric layers for Axum-based HTTP servers"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA-Omniverse/usd-content-workspace/tree/main/common/observability"
resolver = "2"

[features]
axum = ["dep:axum"]
default = ["axum"]
verbose = []

[lib]
name = "axum_observability"
path = "src/lib.rs"

[dependencies.axum]
version = "~0.8"
features = ["matched-path"]
optional = true
default-features = false

[dependencies.bytes]
version = "1.10"
default-features = false

[dependencies.http]
version = "1.3.0"
default-features = false

[dependencies.http-body]
version = "1.0"
default-features = false

[dependencies.opentelemetry]
version = "~0.31"
default-features = false

[dependencies.opentelemetry-semantic-conventions]
version = "~0.31"
features = [
    "semconv_experimental",
    "semconv_experimental",
]
default-features = false

[dependencies.otel-tools]
version = "0.14.0"
path = "../otel-tools"
default-features = false

[dependencies.pin-project-lite]
version = "0.2"
default-features = false

[dependencies.tower-layer]
version = "0.3.3"
default-features = false

[dependencies.tower-service]
version = "0.3.3"
default-features = false

[dependencies.tracing]
version = "~0.1"
default-features = false

[dev-dependencies.pretty_assertions]
version = "1.4"

[dev-dependencies.reqwest]
version = "0.12"
features = [
    "http2",
    "stream",
]
default-features = false

[dev-dependencies.tokio]
version = "1.47"
features = [
    "net",
    "sync",
    "rt-multi-thread",
]
default-features = false

[dev-dependencies.tower]
version = "0.5"
default-features = false
