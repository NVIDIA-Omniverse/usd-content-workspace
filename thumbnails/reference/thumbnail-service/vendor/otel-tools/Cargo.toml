# Vendored from otel-tools 0.14.0 (tonic-observability); see README.md.

[package]
edition = "2024"
rust-version = "1.91.0"
name = "otel-tools"
version = "0.14.0"
authors = ["NVIDIA"]
build = false
include = [
    "/src",
    "/LICENSE.txt",
    "/README.md",
]
publish = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "OpenTelemetry helpers and setup"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA-Omniverse/usd-content-workspace/tree/main/common/observability"
resolver = "2"

[features]
default = ["otlp"]
otlp = [
    "dep:http",
    "dep:opentelemetry-otlp",
    "opentelemetry_sdk/rt-tokio",
]

[lib]
name = "otel_tools"
path = "src/lib.rs"

[dependencies.http]
version = "1.3.0"
optional = true
default-features = false

[dependencies.opentelemetry]
version = "~0.31"
default-features = false

[dependencies.opentelemetry-appender-tracing]
version = "~0.31"
features = ["experimental_use_tracing_span_context"]
default-features = false

[dependencies.opentelemetry-otlp]
version = "~0.31"
features = [
    "logs",
    "metrics",
    "trace",
    "grpc-tonic",
    "http-json",
    "http-proto",
    "reqwest-client",
]
optional = true
default-features = false

[dependencies.opentelemetry-semantic-conventions]
version = "~0.31"
features = [
    "semconv_experimental",
    "semconv_experimental",
]
default-features = false

[dependencies.opentelemetry_sdk]
version = "~0.31"
features = [
    "logs",
    "trace",
    "metrics",
    "rt-tokio",
    "experimental_metrics_periodicreader_with_async_runtime",
    "experimental_logs_batch_log_processor_with_async_runtime",
    "experimental_trace_batch_span_processor_with_async_runtime",
]
default-features = false

[dependencies.serde]
version = "1"
features = [
    "std",
    "std",
]
default-features = false

[dependencies.serde_json]
version = "1"
features = ["std"]
default-features = false

[dependencies.time]
version = "0.3"
features = ["formatting"]
default-features = false

[dependencies.tonic]
version = "~0.14"
features = ["codegen"]
default-features = false

[dependencies.tracing]
version = "~0.1"
default-features = false

[dependencies.tracing-opentelemetry]
version = "~0.32"
default-features = false

[dependencies.tracing-subscriber]
version = "0.3"
features = [
    "fmt",
    "env-filter",
    "registry",
]
default-features = false

[dev-dependencies.pretty_assertions]
version = "1.4"

[dev-dependencies.tokio]
version = "1.47"
features = [
    "net",
    "sync",
    "rt-multi-thread",
]
default-features = false

[dev-dependencies.tracing-core]
version = "*"
