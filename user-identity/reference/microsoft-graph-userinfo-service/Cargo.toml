[workspace]
members = [
    "crates/microsoft-graph-userinfo-service",
    "crates/microsoft-graph-userinfo-capabilities-proto",
    "crates/microsoft-graph-userinfo-publishing",
    "crates/microsoft-graph-userinfo-licensing",
    "crates/microsoft-graph-userinfo-smoke-test",
    "crates/userinfo-conformance-test",
]
resolver = "2"

# Crate versions for workspace members (use `version.workspace = true` in each crate):
# - microsoft-graph-userinfo-service
# - microsoft-graph-userinfo-publishing
# - microsoft-graph-userinfo-smoke-test
[workspace.package]
license = "Apache-2.0"
# In-development version; CI uses it as the dev-version base and replaces it with the Git tag on tagged builds.
version = "0.0.9"
edition = "2024"
