# Check, test and build the self-contained thumbnail-service snapshot.
# Its permission-auth and observability dependencies are vendored in the component.

name: thumbnail-service

on:
  pull_request:
    paths:
      - 'thumbnails/reference/thumbnail-service/**'
      - '.github/workflows/thumbnail-service.yml'
      - '.github/workflows/rust-check.yml'
      - '.github/workflows/rust-test.yml'
      - '.github/workflows/docker-image.yml'
  push:
    # release/v*: the mirrored release branch in the public repository, whose
    # pull request is opened with GITHUB_TOKEN and so gets no pull_request run.
    branches: [main, 'release/v*']
    paths:
      - 'thumbnails/reference/thumbnail-service/**'
      - '.github/workflows/thumbnail-service.yml'
      - '.github/workflows/rust-check.yml'
      - '.github/workflows/rust-test.yml'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: ./.github/workflows/rust-check.yml
    with:
      component: thumbnails/reference/thumbnail-service

  test:
    # thumbnail-smoke-test and thumbnail-conformance-test target a deployed stack.
    #
    # Three tests are skipped pending an upstream fix. Each waits for the
    # 'thumbnail.convert' span, which pipeline.rs opens on the test thread but
    # enters and drops inside tokio::task::spawn_blocking. It is the drop that
    # closes the span and triggers export, and the probe installs its subscriber
    # with set_default, which is thread-local - so the close lands on a thread
    # the probe does not cover and the span never arrives. Their sibling
    # assertions on 'test.publisher', a span that lives entirely on the test
    # thread, resolve every time.
    #
    # They are skipped as a set rather than one at a time: all three share the
    # single root cause, so skipping only the one that happened to fail just
    # moves the failure. Diagnosis reported on the thumbnail-service merge
    # request; the fix is the service owners' call.
    #
    # --test-threads=1 for the same family of reasons. A fourth test,
    # an_unauthenticated_associate_is_reissued_through_the_layered_stack, asserts
    # that outgoing calls carry a traceparent, which needs a live span context.
    # The probe's subscriber is thread-local, so concurrent tests on a small
    # runner are the obvious suspect. Serial execution is cheap here - the whole
    # binary is seconds - and is preferred to excluding more coverage.
    uses: ./.github/workflows/rust-test.yml
    with:
      component: thumbnails/reference/thumbnail-service
      test-args: >-
        --workspace --exclude thumbnail-smoke-test --exclude thumbnail-conformance-test
        -- --test-threads=1
        --skip a_published_message_is_converted_inside_the_publishers_trace
        --skip a_message_without_trace_context_starts_a_new_trace
        --skip a_malformed_traceparent_costs_neither_the_conversion_nor_a_bogus_trace

  # The Dockerfile ends in two independent final stages and neither is a parent
  # of the other, so a single build would only ever prove one of them. Both are
  # deployed -- the chart renders an orchestrator Deployment and a worker
  # Deployment from the same image build -- so both are built here.
  #
  # Two jobs rather than one job building both targets. They share the `builder`
  # stage, but not a runner, so the Rust compile does happen twice and costs
  # roughly twice the runner minutes. Wall-clock is unchanged -- they run in
  # parallel -- and each stage gets its own attributable pass/fail. Fold them
  # into one job if runner minutes ever matter more than that.
  #
  # The snapshot's Dockerfile uses its component directory as the build context,
  # including the vendored dependencies and component .dockerignore.
  image-server:
    uses: ./.github/workflows/docker-image.yml
    with:
      component: thumbnail-service
      build-context: thumbnails/reference/thumbnail-service
      dockerfile: thumbnails/reference/thumbnail-service/docker/Dockerfile
      target: server

  image-task-worker:
    uses: ./.github/workflows/docker-image.yml
    with:
      component: thumbnail-service
      build-context: thumbnails/reference/thumbnail-service
      dockerfile: thumbnails/reference/thumbnail-service/docker/Dockerfile
      target: task-worker
